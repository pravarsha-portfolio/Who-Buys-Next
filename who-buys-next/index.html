<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Who Buys Next</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a guided path. Sticky stepper on top, one step per screen, and every screen split into
   "Your input" zones (lavender, dashed, editable) and "Result" zones (white, solid, read and act).
   Bright single theme by choice, matching the ResearchMind prototype. */
:root{
  color-scheme:light;
  --bg:#F6F5FD; --card:#FFFFFF; --surface:#F9F8FE; --border:#E3E0F3; --border-strong:#CFCAE8;
  --ink:#1A1446; --body:#3C3A55; --muted:#6B6888;
  --purple:#534AB7; --purple-hover:#463DA3; --purple-soft:#EEEBFF; --purple-ink:#3B3394; --mid:#818CF8;
  --in-bg:#F2EFFF; --in-border:#BDB4F2; --in-ink:#4338CA;
  --out-ink:#047857; --out-bg:#D1FAE5;
  --hot:#DC2626; --hot-bg:#FEE2E2; --warm:#B45309; --warm-bg:#FEF3C7; --watch:#1D4ED8; --watch-bg:#DBEAFE;
  --grey-bg:#F0EEF7;
  --shadow:0 1px 2px rgba(26,20,70,.05), 0 6px 20px rgba(26,20,70,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--body); font-family:var(--sans); font-size:14.5px; line-height:1.55; margin:0}
button,input,textarea,select{font:inherit; color:inherit}
a{color:var(--purple)}
:focus-visible{outline:2px solid var(--purple); outline-offset:2px; border-radius:6px}
h1,h2,h3,h4{color:var(--ink); margin:0; text-wrap:balance; line-height:1.25}
p{margin:0}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.stack{display:grid; gap:12px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.sep{height:1px; background:var(--border)}

/* ---------- Header + stepper ---------- */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--card)}
.chrome{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--card); border-bottom:1px solid var(--border); box-shadow:0 2px 10px rgba(26,20,70,.04)}
.bar{max-width:1240px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex; align-items:center; gap:12px; padding-block:10px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0}
.logo{width:32px; height:32px; border-radius:9px; background:var(--purple); display:grid; place-items:center; flex:none}
.brand h1{font-size:15.5px; font-weight:750}
.brand p{font-size:12px; color:var(--muted)}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:650; white-space:nowrap}
.pill .dot{width:7px; height:7px; border-radius:50%; background:currentColor}
.p-live{background:var(--out-bg); color:var(--out-ink)}
.p-demo{background:var(--warm-bg); color:var(--warm)}
.p-ai{background:var(--purple-soft); color:var(--purple-ink)}

.steps{display:flex; gap:0; overflow-x:auto; padding-block:2px 0; scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stp{flex:1 0 auto; display:flex; align-items:center; gap:9px; padding:10px 14px 12px; border:none; background:none; cursor:pointer; color:var(--muted);
  border-bottom:3px solid transparent; text-align:left; position:relative}
.stp:hover{color:var(--ink)}
.stp .n{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--grey-bg); color:var(--muted); flex:none}
.stp b{display:block; font-size:13.5px; font-weight:650; white-space:nowrap}
.stp small{display:block; font-size:11.5px; white-space:nowrap}
.stp.on{color:var(--ink); border-bottom-color:var(--purple)}
.stp.on .n{background:var(--purple); color:#fff}
.stp.done .n{background:var(--out-bg); color:var(--out-ink)}
.stp .badge{font-family:var(--mono); font-size:10.5px; background:var(--purple-soft); color:var(--purple-ink); border-radius:99px; padding:0 6px; margin-left:2px}

/* ---------- Page ---------- */
.main{max-width:1240px; margin:0 auto; padding-block:26px 40px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:grid; gap:18px}
.phead{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap}
.phead h2{font-size:25px; font-weight:780; letter-spacing:-.015em}
.phead p{margin-top:6px; max-width:70ch; color:var(--muted); font-size:15px}
.eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--purple); font-weight:600}
.legend{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- Zones: the input/output language ---------- */
.zone{border-radius:var(--r); padding:18px; display:grid; gap:14px; min-width:0}
.zone.in{background:var(--in-bg); border:1.5px dashed var(--in-border)}
.zone.out{background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow)}
.zh{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap}
.zh h3{font-size:16.5px; font-weight:720; margin-top:6px}
.zh p{font-size:13.5px; color:var(--muted); margin-top:3px; max-width:68ch}
.ztag{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:3px 9px 3px 7px; border-radius:6px; font-family:var(--mono)}
.ztag svg{width:13px; height:13px}
.ztag.in{background:var(--purple); color:#fff}
.ztag.out{background:var(--out-bg); color:var(--out-ink)}
.zone.in .card-in{background:var(--card); border:1px solid var(--in-border); border-radius:10px}

/* ---------- Buttons + fields ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:9px; padding:9px 16px; font-size:13.5px; font-weight:650;
  border:1px solid transparent; cursor:pointer; transition:background .15s,border-color .15s,box-shadow .15s; white-space:nowrap; text-decoration:none}
.btn-primary{background:var(--purple); color:#fff; box-shadow:0 2px 6px rgba(83,74,183,.25)}
.btn-primary:hover{background:var(--purple-hover)}
.btn-primary:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
.btn-outline{background:var(--card); color:var(--purple); border-color:var(--purple)}
.btn-outline:hover{background:var(--purple-soft)}
.btn-outline:disabled{opacity:.45; cursor:not-allowed}
.btn-ghost{background:var(--card); color:var(--body); border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--surface)}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px}
.btn-lg{padding:12px 20px; font-size:15px}
.btn-link{background:none; border:none; color:var(--purple); padding:0; font-weight:650; cursor:pointer; font-size:13px}
.field{display:grid; gap:6px}
.field label{font-size:13px; font-weight:650; color:var(--ink)}
.field .hint{font-size:12px; color:var(--muted)}
input[type=text],input[type=password],textarea,select{width:100%; background:var(--card); border:1.5px solid var(--border-strong); border-radius:9px; padding:9px 11px; font-size:14px}
select{width:auto; min-width:220px; max-width:100%}
textarea{resize:vertical; min-height:90px}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--purple); box-shadow:0 0 0 3px var(--purple-soft)}
.status{font-size:13px; color:var(--muted)}
.status.busy::before{content:""; display:inline-block; width:11px; height:11px; border:2px solid var(--purple); border-top-color:transparent; border-radius:50%; margin-right:7px; vertical-align:-1px; animation:spin .8s linear infinite}

/* ---------- Chips ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:6px; font-size:11.5px; font-weight:650; white-space:nowrap; line-height:1.6}
.c-a{background:var(--purple); color:#fff}
.c-b{background:var(--purple-soft); color:var(--purple-ink)}
.c-c{background:var(--grey-bg); color:var(--muted)}
.c-src{background:var(--card); color:var(--body); border:1px solid var(--border-strong); font-family:var(--mono); font-weight:500; font-size:11px}
.c-sig{background:var(--watch-bg); color:var(--watch); font-family:var(--mono); font-size:11px}
.c-seg{background:#FDF2F8; color:#9D174D}
.c-grey{background:var(--grey-bg); color:var(--muted)}
.c-red{background:var(--hot-bg); color:var(--hot)}
.role-champ{background:var(--out-bg); color:var(--out-ink)}
.role-eval{background:var(--watch-bg); color:var(--watch)}
.role-budget{background:var(--purple-soft); color:var(--purple-ink)}

/* ---------- Heat ---------- */
.heat{display:inline-grid; place-items:center; width:52px; height:52px; border-radius:14px; font-weight:800; font-size:18px; font-variant-numeric:tabular-nums; flex:none; position:relative}
.heat small{position:absolute; bottom:-8px; font-size:9px; font-family:var(--mono); letter-spacing:.06em; padding:0 5px; border-radius:4px; background:var(--card); border:1px solid currentColor}
.h-hot{background:var(--hot-bg); color:var(--hot); box-shadow:inset 0 0 0 2px var(--hot)}
.h-warm{background:var(--warm-bg); color:var(--warm)}
.h-watch{background:var(--watch-bg); color:var(--watch)}
@media (prefers-reduced-motion:no-preference){ .h-hot{animation:pulse 2.4s ease-in-out infinite} }
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 2px var(--hot)} 50%{box-shadow:inset 0 0 0 2px var(--hot),0 0 0 4px var(--hot-bg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Step 1 ---------- */
.prod{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:14px; }
.prod .mark{width:44px; height:44px; border-radius:11px; background:var(--purple); color:#fff; display:grid; place-items:center; font-weight:800}
.callout{background:var(--purple-soft); border-radius:10px; padding:12px 14px; color:var(--ink); font-weight:550}
.seg{border:1px solid var(--border); border-radius:10px; padding:14px; display:grid; gap:8px; background:var(--card); align-content:start}
.seg h4{font-size:14.5px}
.seg .kv{display:grid; grid-template-columns:52px 1fr; gap:6px; font-size:13px}
.seg .kv span:first-child{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding-top:2px}
.seg .buy{color:var(--ink); font-weight:650}
.value{display:inline-flex; gap:3px}
.value i{width:8px; height:8px; border-radius:2px; background:var(--border-strong)}
.value i.on{background:var(--purple)}

/* ---------- Step 2: signal cards ---------- */
.tier{display:grid; gap:8px}
.tier-h{display:flex; align-items:baseline; gap:10px}
.tier-h h4{font-size:14px}
.sig{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:start; padding:12px 14px; background:var(--card); border:1px solid var(--in-border); border-radius:10px}
.sig.off{opacity:.55; background:var(--surface)}
.sig .nm{font-weight:680; color:var(--ink); font-size:14px}
.sig .why{font-size:13px; margin-top:2px}
.sig details{grid-column:2 / -1}
.sig summary{cursor:pointer; font-size:12.5px; font-weight:650; color:var(--purple); list-style:none; display:inline-flex; gap:5px; align-items:center}
.sig summary::-webkit-details-marker{display:none}
.sig summary::before{content:"▸"; transition:transform .15s}
.sig details[open] summary::before{transform:rotate(90deg)}
.adv{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border-strong)}
.adv .q{font-family:var(--mono); font-size:12px; background:var(--surface); border:1.5px solid var(--border-strong); border-radius:8px; padding:7px 9px; word-break:break-word; min-height:34px}
.adv .q:focus{outline:none; border-color:var(--purple); background:var(--card)}
.toggle{width:38px; height:22px; border-radius:999px; border:none; background:var(--border-strong); position:relative; cursor:pointer; flex:none; margin-top:1px}
.toggle::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--purple)}
.toggle.on::after{left:19px}
.stepper{display:inline-flex; align-items:center; border:1.5px solid var(--border-strong); border-radius:8px; overflow:hidden; background:var(--card)}
.stepper button{border:none; background:var(--surface); width:26px; height:28px; cursor:pointer; color:var(--body); font-weight:700}
.stepper button:hover{background:var(--purple-soft)}
.stepper span{width:28px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}
details.tune > summary{cursor:pointer; list-style:none}
details.tune > summary::-webkit-details-marker{display:none}
.wrow{display:grid; grid-template-columns:110px 1fr 44px; gap:12px; align-items:center}
input[type=range]{accent-color:var(--purple); width:100%}
.formula{font-family:var(--mono); font-size:12.5px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:12px; color:var(--ink); line-height:1.75; overflow-x:auto}
.bands{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- Step 3 ---------- */
.run{display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:center; padding:9px 12px; border:1px solid var(--border); border-radius:9px; background:var(--card)}
.run .st{width:18px; height:18px; border-radius:50%; border:2px solid var(--border-strong)}
.run.busy .st{border-color:var(--purple); border-top-color:transparent; animation:spin .8s linear infinite}
.run.ok .st{background:var(--out-ink); border-color:var(--out-ink)}
.run.err .st{background:var(--hot); border-color:var(--hot)}
.log{font-family:var(--mono); font-size:11.5px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px 12px; max-height:200px; overflow:auto; display:grid; gap:3px}
.note{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px; background:var(--warm-bg); color:var(--ink); font-size:13.5px}
.note.info{background:var(--watch-bg)}
.note svg{flex:none; margin-top:2px}

/* ---------- Step 4 ---------- */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.kpi{padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); display:flex; gap:12px; align-items:center}
.kpi i{width:10px; height:34px; border-radius:4px; flex:none}
.kpi b{display:block; font-size:22px; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.1}
.kpi span{font-size:12.5px; color:var(--muted)}
.filters{display:flex; gap:6px; flex-wrap:wrap}
.fbtn{border:1.5px solid var(--in-border); background:var(--card); border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:650; cursor:pointer; color:var(--body)}
.fbtn:hover{border-color:var(--purple)}
.fbtn.on{background:var(--purple); color:#fff; border-color:var(--purple)}
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:16px; align-items:start}
.acc{display:grid; grid-template-columns:auto 1fr; gap:14px; padding:14px; border:1px solid var(--border); border-radius:11px; background:var(--card); cursor:pointer; text-align:left; width:100%; transition:border-color .15s, box-shadow .15s}
.acc:hover{border-color:var(--border-strong); box-shadow:var(--shadow)}
.acc.sel{border-color:var(--purple); box-shadow:0 0 0 3px var(--purple-soft)}
.acc h4{font-size:15px; font-weight:720}
.acc p{margin-top:4px; font-size:13px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.detail{position:sticky; top:150px}
.sbar{display:grid; grid-template-columns:86px 1fr 40px; gap:10px; align-items:center; font-size:13px}
.sbar .track{height:8px; background:var(--grey-bg); border-radius:99px; overflow:hidden}
.sbar .fill{height:100%; background:var(--purple); border-radius:99px}
.ev{display:grid; grid-template-columns:14px 1fr; gap:12px; padding:8px 0}
.ev .pin{width:10px; height:10px; border-radius:50%; background:var(--purple); margin-top:6px; box-shadow:0 0 0 3px var(--purple-soft)}
.ev h5{margin:4px 0 2px; font-size:13.5px; color:var(--ink); font-weight:600}
.ev a{font-size:12.5px; word-break:break-word}
.why{background:var(--purple-soft); border-radius:9px; padding:10px 12px; color:var(--ink)}
.reject{display:grid; gap:4px; padding:10px 12px; border-radius:9px; background:var(--surface); border:1px dashed var(--border-strong)}
.reject s{color:var(--muted)}

/* ---------- Step 5 + 6 ---------- */
.person{display:grid; grid-template-columns:44px 1fr; gap:12px; padding:14px; border:1px solid var(--border); border-radius:11px; background:var(--card)}
.ava{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-weight:750; background:var(--purple-soft); color:var(--purple-ink)}
.ava.ghost{background:var(--surface); color:var(--muted); border:1.5px dashed var(--border-strong)}
.person h4{font-size:15px}
.seq .it{display:grid; grid-template-columns:64px 1fr; gap:12px; padding:9px 0; border-bottom:1px dashed var(--border)}
.seq .it:last-child{border-bottom:none}
.seq .day{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--purple-ink); background:var(--purple-soft); border-radius:6px; padding:3px 6px; text-align:center; align-self:start}
.tabs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:4px; overflow-x:auto}
.tab{border:none; background:none; padding:7px 12px; font-weight:650; font-size:13px; color:var(--muted); cursor:pointer; border-radius:7px; white-space:nowrap}
.tab.on{background:var(--card); color:var(--purple); box-shadow:0 1px 3px rgba(26,20,70,.1)}
.msg{white-space:pre-wrap; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; font-size:14px; color:var(--ink); line-height:1.65}
.meta{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--muted)}

/* ---------- Footer nav, empty, modal ---------- */
.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding-top:8px; border-top:1px solid var(--border); margin-top:6px}
.empty{display:grid; place-items:center; text-align:center; gap:10px; padding:32px 18px; border:1.5px dashed var(--border-strong); border-radius:var(--r); color:var(--muted); background:var(--card)}
.empty h3{color:var(--ink); font-size:16px}
.scrim{position:fixed; inset:0; background:rgba(26,20,70,.4); display:grid; place-items:center; z-index:50; padding:16px}
.modal{background:var(--card); border-radius:16px; width:min(560px,100%); max-height:90vh; overflow:auto; padding:22px; display:grid; gap:14px; border:1px solid var(--border)}
.toast{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:9px; font-size:13.5px; font-weight:650; z-index:60}
.tbl-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--card)}
table{border-collapse:collapse; width:100%; min-width:620px}
th{text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:9px 12px; background:var(--surface); border-bottom:1px solid var(--border)}
td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; font-size:13px}
tr:last-child td{border-bottom:none}
ol.clean{margin:0; padding-left:18px; display:grid; gap:6px}

@media (max-width:1000px){ .split{grid-template-columns:1fr} .detail{position:static} .grid3{grid-template-columns:1fr 1fr} .adv{grid-template-columns:1fr 1fr} }
@media (max-width:760px){
  .grid2,.grid3,.adv{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .brand p,.stp small{display:none}
  .stp{padding:9px 10px 11px}
  .phead h2{font-size:21px}
  .sig{grid-template-columns:auto 1fr}
  .sig > .row:last-child{grid-column:2}
  .prod{grid-template-columns:auto 1fr}
  .prod > :last-child{grid-column:1 / -1}
}
/* ---------- Scout: signal picker, run bar, live feed ---------- */
.picks{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.pick{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:start; padding:10px 12px; background:var(--card); border:1.5px solid var(--border); border-radius:10px; cursor:pointer}
.pick:hover{border-color:var(--in-border)}
.pick.on{border-color:var(--purple); background:#FBFAFF}
.pick input{width:17px; height:17px; margin-top:2px; accent-color:var(--purple)}
.pick b{color:var(--ink); font-size:13.5px; font-weight:650}
.runbar{position:sticky; bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:5; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--card); border:1.5px solid var(--purple); border-radius:14px; padding:14px 16px; box-shadow:0 8px 28px rgba(83,74,183,.18)}
.prog{height:8px; background:var(--grey-bg); border-radius:99px; overflow:hidden}
.prog span{display:block; height:100%; background:var(--purple); border-radius:99px; transition:width .4s}
.lead{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:12px 14px; border:1px solid var(--border); border-radius:11px; background:var(--card)}
@media (prefers-reduced-motion:no-preference){ .lead.new{animation:slidein .35s ease-out} }
@keyframes slidein{from{transform:translateY(6px); opacity:.4} to{transform:none; opacity:1}}
.runs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
@media (max-width:760px){ .picks,.runs{grid-template-columns:1fr} .lead{grid-template-columns:auto 1fr} .lead > .btn{grid-column:2; justify-self:start} }

/* ---------- Scoring ---------- */
function freshScore(date){
  if (!date) return 3;
  const d = new Date(date); if (isNaN(d)) return 3;
  const days = (TODAY - d) / 864e5;
  if (days <= 30) return 5; if (days <= 90) return 4; if (days <= 180) return 3; if (days <= 365) return 2; return 0;
}
function evScore(e, acc){
  const sig = sigById(e.sid), w = S.weights, tot = w.intent + w.early + w.fit + w.fresh || 1;
  const g = segById(acc.seg); const fit = g ? ((+acc.fit||3) + g.value) / 2 : (+acc.fit||3);
  const parts = {intent:+e.intent || sig.intent, early:sig.earliness, fit, fresh:freshScore(e.date)};
  const v = (w.intent*parts.intent + w.early*parts.early + w.fit*parts.fit + w.fresh*parts.fresh) / tot / 5 * 100;
  return {v, parts};
}
function heat(acc){
  const live = (acc.ev||[]).filter(e => sigById(e.sid).on !== false && freshScore(e.date) > 0);
  if (!live.length) return {v:0, best:null, distinct:0, parts:{}};
  let best = null;
  for (const e of live){ const s = evScore(e, acc); if (!best || s.v > best.v) best = {...s, e}; }
  const distinct = new Set(live.map(e => e.sid)).size;
  const v = Math.min(100, Math.round(best.v + S.stack * Math.min(2, distinct - 1)));
  return {v, best:best.e, parts:best.parts, distinct, base:Math.round(best.v)};
}
const band = v => v >= 75 ? 'hot' : v >= 55 ? 'warm' : 'watch';
const BAND_LABEL = {hot:'HOT', warm:'WARM', watch:'WATCH'};

function parseJSON(t){
  if (typeof t !== 'string') return t;
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) t = f[1];
  try { return JSON.parse(t); } catch(e){}
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); const c = t.indexOf('['), d = t.lastIndexOf(']');
  const cand = (a > -1 && (c === -1 || a < c)) ? t.slice(a, b+1) : t.slice(c, d+1);
  return JSON.parse(cand);
}
const aiReady = () => (ENV.backend && (S.settings.key || ENV.serverAI)) || !!ENV.sample;
async function ask(prompt, tier){
  if (ENV.backend && (S.settings.key || ENV.serverAI)){
    const r = await fetch('api/ai', {method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({prompt, provider:S.settings.provider==='auto'?undefined:S.settings.provider, key:S.settings.key||undefined, model:S.settings.model||undefined})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'AI request failed');
    return parseJSON(j.text);
  }
  if (ENV.sample){
    try { return await ENV.sample.json(prompt, {modelTier: tier || 'default', cache:false}); }
    catch(e){ throw new Error(e.code === 'not_granted' ? 'Claude access was not allowed for this page.' : e.code === 'rate_limited' ? 'Claude is busy. Try again in a minute.' : (e.message || 'Claude could not answer.')); }
  }
  throw new Error('No AI connected. Open Settings to add a key.');
}

async function freeSearch(q, src){
  try { const r = await fetch(`api/search?src=${encodeURIComponent(src)}&q=${encodeURIComponent(q)}`); if (!r.ok) return []; return (await r.json()).results || []; } catch(e){ return []; }
}
async function aiSearch(q, src){

    const kk = keyKind();
    const r = await fetch('api/websearch', {method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({q, src, provider:['claude','gemini'].includes(kk)?kk:undefined, key:['claude','gemini'].includes(kk)?S.settings.key:undefined})});
    const j = await r.json(); return j.results || [];
  } catch(e){ return []; }
}
async function search(q, src){
  const mode = S.settings.searchMode || 'auto';
  if (mode === 'ai' && aiSearchReady()) return aiSearch(q, src);
  let res = await freeSearch(q, src);
  if (mode !== 'free' && res.length < 3 && aiSearchReady()){ const more = await aiSearch(q, src); const seen = new Set(res.map(r=>r.url)); res = res.concat(more.filter(r=>!seen.has(r.url))); }
  return res;
}

function guessKind(key){
  if (/^sk-ant-/.test(key)) return 'claude'; if (/^AIza/.test(key)) return 'gemini'; if (/^gsk_/.test(key)) return 'groq';

      <div class="stack"><span class="label">Weights</span>
        ${[['intent','Intent'],['early','Earliness'],['fit','Fit'],['fresh','Freshness']].map(([k,l])=>`<div class="wrow"><label for="w-${k}" class="small" style="font-weight:650">${l}</label><input id="w-${k}" type="range" min="0" max="60" value="${w[k]}" data-w="${k}"><span class="num mono">${w[k]}</span></div>`).join('')}
        <div class="wrow"><label for="w-stack" class="small" style="font-weight:650">Stacking</label><input id="w-stack" type="range" min="0" max="15" step="1" value="${S.stack}" data-w="stack"><span class="num mono">+${S.stack}</span></div></div>
      <div class="stack"><span class="label">Segment value (feeds Fit)</span>
        ${S.business.segments.map((g,i)=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="small" style="color:var(--ink);font-weight:600">${esc(g.name)}</span>
          <span class="stepper"><button data-act="segdec" data-i="${i}" aria-label="Lower ${esc(g.name)}">−</button><span>${g.value}</span><button data-act="seginc" data-i="${i}" aria-label="Raise ${esc(g.name)}">+</button></span></div>`).join('')}</div>
    </div></details>` +
  zone('out', 'How every buyer gets scored', 'This is the rule the scout applies. Hot accounts go to sales this week.', `
    <div class="formula">Heat = ( ${w.intent}·Intent + ${w.early}·Earliness + ${w.fit}·Fit + ${w.fresh}·Freshness ) ÷ ${tot} ÷ 5 × 100<br>+${S.stack} for each extra signal at the same company (max 2) · capped at 100</div>
    <div class="bands"><span class="chip c-red">HOT 75+ · act this week</span><span class="chip" style="background:var(--warm-bg);color:var(--warm)">WARM 55–74 · nurture</span><span class="chip" style="background:var(--watch-bg);color:var(--watch)">WATCH below 55</span><span class="small muted">Freshness: ≤30 days = 5 · ≤90 = 4 · ≤180 = 3 · ≤365 = 2 · older is thrown out</span></div>
    <div class="grid2">
      <div class="stack" style="gap:8px"><span class="label">Thrown out as noise</span><ol class="clean small">${S.noise.map(n=>`<li>${esc(n)}</li>`).join('')}</ol></div>
      <div class="stack" style="gap:8px"><span class="label">Tender or job post?</span>
        <p class="small">A tender for research <b>services</b> buys an agency, not a tool, so it is off by default and only used to find the agency that wins. A tender for <b>analysis software</b> (NVivo, ATLAS.ti, MAXQDA licences) is a buyer with budget for our category, so it scores high. A job post that mentions synthesis is a named team with a decision 1–3 months away.</p></div>
    </div>`);
},

scout(){
  const live = ENV.backend, busy = RUN.busy;
  const on = S.signals.filter(s=>s.on), custom = S.signals.filter(s=>s.custom);
  const kk = keyKind();
  const canRun = live && aiReady() && on.length && !busy;
  const why = !live ? 'Live scouting runs on your deployed site. This preview is sandboxed from the web.' : !aiReady() ? 'Add your API key above to run.' : !on.length ? 'Pick at least one signal.' : '';
  return phead(3, 'Find buyers', 'Pick the signals to hunt, add your own if you like, then run. Buyers appear below the moment each signal finishes.') +

  zone('in', '1 · Pick signals to run', 'These are the same signals as Step 2. Switching one here switches it there too.', `
    <div class="row"><button class="btn btn-ghost btn-sm" data-act="pickAll">Select all</button><button class="btn btn-ghost btn-sm" data-act="pickA">Strongest only</button><button class="btn btn-ghost btn-sm" data-act="pickNone">Clear</button>
      <span class="small muted" style="margin-left:auto"><b style="color:var(--ink)">${on.length}</b> of ${S.signals.length} selected</span></div>
    <div class="picks">${S.signals.map((s,i)=>`<label class="pick ${s.on?'on':''}">
      <input type="checkbox" data-act="pick" data-i="${i}" ${s.on?'checked':''} ${busy?'disabled':''}>
      <span style="min-width:0"><span class="row" style="gap:6px"><span class="mono small muted">${esc(s.id)}</span><b>${esc(s.name)}</b></span>
      <span class="row" style="gap:4px;margin-top:3px"><span class="chip c-${String(s.tier).toLowerCase()}">${s.tier==='A'?'Strong':s.tier==='B'?'Good':'Background'}</span><span class="chip c-src">${esc(SOURCES[s.src]||s.src)}</span>${s.custom?'<span class="chip c-seg">Yours</span>':''}</span></span>
      ${s.custom?`<button class="btn-link small" data-act="delSig" data-i="${i}" aria-label="Remove ${esc(s.name)}">Remove</button>`:''}</label>`).join('')}</div>`) +

  zone('in', '2 · Add your own signal (optional)', 'Skip this to run with the signals above. Anything you add is scouted together with them.', `
    <div class="grid3">
      <div class="field"><label for="cName">What are you looking for?</label><input id="cName" type="text" placeholder="e.g. Design schools launching UX research courses"></div>
      <div class="field"><label for="cQuery">Search words</label><input id="cQuery" type="text" placeholder="e.g. new UX research course 2026 design school"></div>
      <div class="field"><label for="cSrc">Where to look</label><select id="cSrc" style="width:100%">${Object.entries(SOURCES).filter(([k])=>k!=='linkedin').map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="field"><label for="cSeg">Which buyers</label><select id="cSeg" style="width:100%">${S.business.segments.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="cTier">How strong is it?</label><select id="cTier" style="width:100%"><option value="A">Strong: names the need</option><option value="B" selected>Good: creates the need</option><option value="C">Background</option></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn btn-outline" data-act="addSig" ${busy?'disabled':''}>+ Add signal</button></div>
    </div><span id="cStatus" class="status"></span>`) +

  keyZone(3) +
  zone('in', '4 · Search settings', '', `
    <div class="grid2"><div class="field"><label for="region">Focus region</label><input id="region" type="text" value="${esc(S.settings.region)}" data-set="region"><span class="hint">Write "global" for no focus.</span></div>
      <div class="field"><label for="sSearch2">Search with</label><select id="sSearch2" style="width:100%">
        <option value="auto" ${(S.settings.searchMode||'auto')==='auto'?'selected':''}>Free search, AI search fills gaps</option>
        <option value="ai" ${S.settings.searchMode==='ai'?'selected':''}>AI web search only (most reliable)</option>
        <option value="free" ${S.settings.searchMode==='free'?'selected':''}>Free search only</option></select></div></div>`) +

  `<div class="runbar">
    <div><b style="color:var(--ink);font-size:15px">${busy?'Scouting '+RUN.rows.length+' signals…':'Ready to scout '+on.length+' signal'+(on.length===1?'':'s')+(custom.length?' ('+custom.length+' yours)':'')}</b>
      <div class="small muted">${busy?'Results appear below as each signal finishes.':esc(why||'About 30–90 seconds. Results stream in below.')}</div></div>
    ${busy?`<button class="btn btn-ghost btn-lg" data-act="stopScout">Stop</button>`:`<button class="btn btn-primary btn-lg" data-act="scout" ${canRun?'':'disabled'}>▶ Run scout</button>`}
  </div>` +

  zone('out', 'Live results', '', `<div id="liveOut">${liveHTML()}</div>`) +

  zone('in', 'Or check one signal you found', 'Paste a job post, Reddit thread, review or news item with its link.', `
    <div class="field"><label for="pasteSig">Signal text and link</label>
      <textarea id="pasteSig" rows="4" placeholder="https://job-boards.greenhouse.io/…&#10;Senior UX Researcher at Acme. You will own our research repository…"></textarea></div>
    <div class="row"><button class="btn btn-outline" data-act="scorePaste" ${aiReady()?'':'disabled'}>Check this signal</button><span id="pasteStatus" class="status"></span></div>
    <div id="pasteOut"></div>`);
},

accounts(){
  const all = ranked();
  const f = S.filter;
  const list = all.filter(x => f==='all' || band(x.h.v)===f || x.a.seg===f);
  const sel = S.accounts.find(a=>a.id===S.sel && list.some(x=>x.a.id===a.id)) || (list[0]&&list[0].a);
  const counts = {hot:0,warm:0,watch:0}; all.forEach(x=>counts[band(x.h.v)]++);
  return phead(4, 'Ranked buyers', 'Every organisation the scout kept, hottest first. Pick one to see why it scored, the evidence, and who to contact.',
    `<button class="btn btn-ghost btn-sm" data-act="csv">Copy list as CSV</button>`) +
  zone('in', 'Filter the list', '', `<div class="filters">${[['all','All '+all.length],['hot','Hot'],['warm','Warm'],['watch','Watch'],...S.business.segments.filter(g=>all.some(x=>x.a.seg===g.id)).map(g=>[g.id,g.name])].map(([k,l])=>`<button class="fbtn ${f===k?'on':''}" data-filter="${k}">${esc(l)}</button>`).join('')}</div>`) +
  zone('out', `${list.length} buyer${list.length===1?'':'s'}`, '', `
    <div class="kpis">
      <div class="kpi"><i style="background:var(--hot)"></i><div><b>${counts.hot}</b><span>Hot · act this week</span></div></div>
      <div class="kpi"><i style="background:var(--warm)"></i><div><b>${counts.warm}</b><span>Warm · nurture</span></div></div>
      <div class="kpi"><i style="background:var(--watch)"></i><div><b>${counts.watch}</b><span>Watch</span></div></div>
      <div class="kpi"><i style="background:var(--border-strong)"></i><div><b>${S.rejected.length}</b><span>Thrown out as noise</span></div></div>
    </div>
    ${list.length?`<div class="split">
      <div class="stack" style="gap:10px">${list.map(({a,h})=>`<button class="acc ${sel&&sel.id===a.id?'sel':''}" data-acc="${a.id}">
        ${heatBox(h.v)}
        <span style="min-width:0"><span class="row" style="justify-content:space-between"><h4>${esc(a.company)}</h4><span class="small muted">${esc(a.region||'')}</span></span>
          <span class="row" style="margin-top:5px;gap:4px">${segChip2(a.seg)}${[...new Set(a.ev.map(e=>e.sid))].map(sigChip).join('')}${h.distinct>=2?'<span class="chip c-red">Stacked</span>':''}</span>
          <p>${esc(a.why_now)}</p></span></button>`).join('')}
        ${S.rejected.length?`<details><summary class="btn-link" style="cursor:pointer">Show what was thrown out as noise (${S.rejected.length})</summary>
          <div class="stack" style="gap:8px;margin-top:10px">${S.rejected.map(r=>`<div class="reject"><div class="row"><s>${esc(r.company)}</s>${r.sid?sigChip(r.sid):''}</div><span class="small">${esc(r.reason)}</span>${r.url&&!String(r.url).startsWith('#')?`<a class="small" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(host(r.url))}</a>`:''}</div>`).join('')}</div></details>`:''}
      </div>
      ${sel?accountDetail(sel):''}
    </div>`:`<div class="empty"><h3>No buyers match this filter</h3><p>Choose "All", or run the scout in Step 3.</p><button class="btn btn-primary" data-go="scout">Go to Scout</button></div>`}`);
},

people(){
  const opts = ranked();
  const acc = S.accounts.find(a=>a.id===S.sel) || (opts[0]&&opts[0].a);
  if (!acc) return phead(5,'Who to contact','Pick a buyer first.') + `<div class="empty"><h3>No buyer selected</h3><button class="btn btn-primary" data-go="accounts">Go to Accounts</button></div>`;
  const ppl = S.people[acc.id] || [];
  const g = segById(acc.seg) || {buyer:'Head of Research, Head of Design, Head of Product', user:'Researchers', name:''};
  const roles = [...g.buyer.split(/,| or /).map(r=>({role:r.trim(), part:'Budget'})), {role:String(g.user).split(',')[0].trim(), part:'Champion (user)'}].filter(r=>r.role);
  const missing = roles.filter(r => !ppl.some(x => x.title && r.role.toLowerCase().split(/[\/ ]+/).some(w=>w.length>4 && x.title.toLowerCase().includes(w))));
  return phead(5, 'Who to contact', 'Real people only. Every name links to the page it was found on. Roles nobody was found for get a ready-made LinkedIn search.') +
  zone('in', 'Choose a buyer', '', `<div class="row">
      <select id="accPick" aria-label="Buyer">${opts.map(({a,h})=>`<option value="${a.id}" ${a.id===acc.id?'selected':''}>${esc(a.company)} · heat ${h.v}</option>`).join('')}</select>
      ${ENV.backend?`<button class="btn btn-primary" data-act="findPeople" ${aiReady()&&!RUN.busy?'':'disabled'}>${RUN.busy?'Searching…':'Find people at '+esc(acc.company)}</button>`:''}
      <span id="peopleStatus" class="status"></span></div>
    <div class="small"><b>Budget sits with:</b> ${esc(g.buyer)} · <b>Daily users:</b> ${esc(g.user)}</div>
    ${ENV.backend?'':`<div class="note info">${ICON.info}<span>In the deployed app, <b>Find people</b> reads ${esc(acc.domain||'the company website')} team pages and public LinkedIn results.</span></div>`}`) +
  zone('out', ppl.length?`${ppl.length} people found at ${esc(acc.company)}`:`No named people yet at ${esc(acc.company)}`, '', `
    ${ppl.length?`<div class="grid2">${ppl.map(p=>personCard(acc,p)).join('')}</div>`:''}
    ${missing.length?`<div class="stack" style="gap:10px"><span class="label">Still to find</span><div class="grid2">${missing.map(p=>{const q=`${p.role.split('/')[0].trim()} ${acc.company}`;return `<div class="person"><span class="ava ghost">?</span><div class="stack" style="gap:6px">
      <div class="row" style="justify-content:space-between"><h4>${esc(p.role)}</h4><span class="chip ${p.part.startsWith('Champion')?'role-champ':'role-budget'}">${esc(p.part)}</span></div>
      <span class="small muted">${p.part==='Budget'?'Holds the budget for '+esc(g.name||'this segment')+'.':'Uses the product daily. Good for a warm intro, not for the deal.'}</span>
      <div class="row"><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent(q)}">Search LinkedIn</a>
      <a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent('site:linkedin.com/in "'+acc.company+'" '+p.role.split('/')[0].trim())}">Search Google</a></div></div></div>`;}).join('')}</div></div>`:''}`);
},

outreach(){
  const allPeople = Object.entries(S.people).flatMap(([aid,ps])=>ps.map(p=>({aid,p,key:aid+'::'+p.name})));
  if (!allPeople.some(x=>x.key===S.personSel) && allPeople.length) S.personSel = (allPeople.find(x=>S.outreach[x.key])||allPeople[0]).key;
  const [aid, pname] = String(S.personSel||'').split('::');
  const acc = S.accounts.find(a=>a.id===aid); const person = (S.people[aid]||[]).find(p=>p.name===pname);
  const o = S.outreach[S.personSel];
  return phead(6, 'What to send', 'A channel plan and ready-to-send messages for one person, written from the evidence that put their organisation on the list.') +
  zone('in', 'Who are you writing to?', '', allPeople.length?`<div class="row">
      <select id="personPick" aria-label="Person">${allPeople.map(x=>{const a=S.accounts.find(z=>z.id===x.aid);return `<option value="${esc(x.key)}" ${x.key===S.personSel?'selected':''}>${esc(x.p.name)} · ${esc(a?a.company:'')}${S.outreach[x.key]?' · written':''}</option>`;}).join('')}</select>
      <div class="field" style="flex:1;min-width:200px"><input id="sender" type="text" value="${esc(S.settings.sender)}" data-set="sender" aria-label="Sign messages as" placeholder="Sign messages as"></div>
      ${person?`<button class="btn btn-primary" data-act="write" ${aiReady()&&!RUN.busy?'':'disabled'}>${RUN.busy?'Writing…':o?'Rewrite messages':'Write messages'}</button>`:''}</div>
      <span id="writeStatus" class="status"></span>${person&&!o?aiNote():''}`
    :`<div class="empty"><h3>Find people first</h3><p>Named people from Step 5 appear here.</p><button class="btn btn-primary" data-go="people">Go to People</button></div>`) +
  (o&&acc&&person ? outreachView(acc,person,o) : allPeople.length ? zone('out','Messages','', `<div class="empty"><h3>Nothing written for ${esc(pname||'this person')} yet</h3><p>Press "Write messages".</p></div>`) : '');
},

onepager(){
  const b = S.business, top = ranked().slice(0,5), w = S.weights;
  const live = ranked()[0];
  return phead(7, esc(b.name)+' signal playbook', 'The one page to share with the sales team: who buys, what to watch, how to score it, and real signals found.',
    `<div class="row"><button class="btn btn-primary" data-act="copyMd">Copy as Markdown</button><button class="btn btn-ghost" data-act="copyJson">Copy recipe JSON</button></div>`) +
  zone('out', 'One-page playbook', '', `
    <div class="callout"><span class="label" style="color:var(--purple-ink)">A buyer is ready when</span><div style="margin-top:4px">${esc(b.trigger)}</div></div>
    <div><span class="label">Who buys, by segment</span>
      <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Segment</th><th>Buyer</th><th>How to sell</th></tr></thead>
      <tbody>${b.segments.map(g=>`<tr><td><b style="color:var(--ink)">${esc(g.name)}</b></td><td>${esc(g.buyer)}</td><td class="muted">${esc(g.motion)}</td></tr>`).join('')}</tbody></table></div></div>
    <div><span class="label">Signals to watch (${S.signals.filter(s=>s.on).length} on)</span>
      <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>ID</th><th>Signal</th><th>Where</th><th>Lead time</th><th>Intent</th></tr></thead>
      <tbody>${S.signals.filter(s=>s.on).map(s=>`<tr><td class="mono">${s.id}</td><td><b style="color:var(--ink)">${esc(s.name)}</b></td><td>${esc(SOURCES[s.src]||s.src)}</td><td>${esc(s.lead)}</td><td class="num">${s.intent}/5</td></tr>`).join('')}</tbody></table></div></div>
    <div class="grid2">
      <div class="stack" style="gap:8px"><span class="label">How we score</span><div class="formula">Heat = (${w.intent}·Intent + ${w.early}·Earliness + ${w.fit}·Fit + ${w.fresh}·Freshness) ÷ ${w.intent+w.early+w.fit+w.fresh} ÷ 5 × 100 · +${S.stack} per extra stacked signal<br>HOT 75+ · WARM 55–74 · WATCH below 55</div></div>
      <div class="stack" style="gap:8px"><span class="label">Thrown out as noise</span><ol class="clean small">${S.noise.map(n=>`<li>${esc(n)}</li>`).join('')}</ol></div>
    </div>
    ${live?`<div class="stack" style="gap:8px"><span class="label">Real signal found ${S.source==='demo'?'(checked '+esc(S.runAt)+')':'live'}</span>
      <div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:14px">${heatBox(live.h.v)}
      <div><b style="color:var(--ink);font-size:15px">${esc(live.a.company)}</b> <span class="muted small">${esc(live.a.region||'')}</span>
      <p style="margin:4px 0">${esc(live.a.why_now)}</p>
      ${live.a.ev.map(e=>`<div class="small">${sigChip(e.sid)} <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></div>`).join('')}</div></div></div>`:''}
    ${top.length>1?`<div><span class="label">Top buyers right now</span><ol class="clean" style="margin-top:8px">${top.map(({a,h})=>`<li><b style="color:var(--ink)">${esc(a.company)}</b> · ${h.v} · ${segChip2(a.seg)} <span class="small">${esc(a.why_now)}</span></li>`).join('')}</ol></div>`:''}`);
}
};

function stepper(i, k, v){
  return `<span class="stepper"><button data-act="dec" data-i="${i}" data-k="${k}" aria-label="Lower ${k}">−</button><span>${v}</span><button data-act="inc" data-i="${i}" data-k="${k}" aria-label="Raise ${k}">+</button></span>`;
}

function accountDetail(a){
  const h = heat(a), p = h.parts || {};
  const g = segById(a.seg);
  return `<div class="detail stack" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
      <div style="min-width:0"><h3 style="font-size:19px">${esc(a.company)}</h3>
        <div class="small muted">${esc([a.region,a.size,a.domain].filter(Boolean).join(' · '))}</div></div>
      ${heatBox(h.v)}</div>
    <div class="why"><span class="label" style="color:var(--purple-ink)">Why now</span><div style="margin-top:3px">${esc(a.why_now)}</div></div>
    ${g?`<div class="small"><b>Segment:</b> ${esc(g.name)} · <b>Budget:</b> ${esc(g.buyer)} · <span class="muted">${esc(g.motion)}</span></div>`:''}
    ${a.risk?`<div class="small"><b>Watch out:</b> ${esc(a.risk)}</div>`:''}
    <div class="stack" style="gap:8px"><span class="label">Score: strongest signal ${h.best?esc(h.best.sid):''}${h.distinct>=2?' + '+(S.stack*Math.min(2,h.distinct-1))+' for '+h.distinct+' stacked signals':''}</span>
      ${[['Intent',p.intent],['Earliness',p.early],['Fit',p.fit],['Freshness',p.fresh]].map(([l,v])=>`<div class="sbar"><span>${l}</span><span class="track"><span class="fill" style="width:${(v||0)*20}%"></span></span><span class="num mono">${Math.round((v||0)*10)/10}/5</span></div>`).join('')}</div>
    <div class="sep"></div>
    <span class="label">Evidence</span>
    <div>${[...a.ev].sort((x,y)=>String(y.date).localeCompare(String(x.date))).map(e=>{const s=sigById(e.sid);const fs=freshScore(e.date);return `<div class="ev"><span class="pin" aria-hidden="true"></span><div>
      <div class="row" style="gap:6px">${sigChip(e.sid)}<span class="small muted">${esc(s.name)} · ${esc(e.dateLabel||e.date||'date unknown')}</span>${fs===0?'<span class="chip c-grey">stale</span>':''}</div>
      <h5>${esc(e.what)}</h5>
      ${String(e.url).startsWith('#')?`<span class="small muted">${esc(e.title)}</span>`:`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title||host(e.url))} ↗</a>`}</div></div>`;}).join('')}</div>
    <div class="row"><button class="btn btn-primary" data-act="toPeople" data-id="${a.id}">Who to contact →</button>
      <button class="btn btn-ghost btn-sm" data-act="dropAcc" data-id="${a.id}">Not a buyer</button></div>
  </div>`;
}

function personCard(acc, p){
  const key = acc.id+'::'+p.name;
  const cls = p.role==='Champion'?'role-champ':p.role==='Evaluator'?'role-eval':'role-budget';

function mergeLead(L, sig, sourceTitle){
  const name = String(L.company||'').trim(); if (!name) return null;
  const bad = S.business.competitors.concat([S.business.name]).some(c => name.toLowerCase().includes(c.toLowerCase().split(' ')[0]));
  if (bad){ S.rejected.unshift({company:name, sid:sig.id, reason:'Competitor or our own company.', url:L.url}); return null; }
  if (L.date && freshScore(L.date) === 0){ S.rejected.unshift({company:name, sid:sig.id, reason:'Stale: older than 12 months ('+L.date+').', url:L.url}); return null; }
  const id = slug(name);
  let a = S.accounts.find(x => x.id === id || x.company.toLowerCase() === name.toLowerCase());
  if (!a){ a = {id, seg:segById(L.seg)?L.seg:((sig.segs||[])[0]||''), company:name, domain:L.domain||'', region:L.region||'', size:'', fit:+L.fit||3, fitWhy:L.fit_why||'', why_now:L.why_now||L.what||'', risk:'', ev:[]}; S.accounts.push(a); }
  if (!a.ev.some(e => e.url === L.url && e.sid === sig.id)){
    a.ev.push({sid:sig.id, intent:+L.intent||sig.intent, date:L.date||'', dateLabel:L.date||'', title:sourceTitle||host(L.url), url:L.url, what:L.what||''});
    a.fit = Math.max(a.fit||0, +L.fit||0) || a.fit; if (!a.domain && L.domain) a.domain = L.domain;
    if (L.why_now && (+L.intent||0) >= 4) a.why_now = L.why_now;
  }
  return a;
}

async function runScout(){
  if (RUN.busy) return;
  const on = S.signals.filter(s=>s.on);
  if (!on.length) return;
  RUN = {busy:true, stop:false, rows:on.map(s=>({id:s.id, state:'', note:'waiting'})), log:[], found:[], rejectedNow:0};
  if (S.source==='demo'){ S.accounts=[]; S.rejected=[]; S.people={}; S.outreach={}; S.source='live'; }
  render(); log(`Hunting ${on.length} signals for ${S.business.name}…`);
  const queue = [...on];
  async function worker(){
    while (queue.length && !RUN.stop){
      const sig = queue.shift();
      setRow(sig.id, {state:'busy', note:'searching '+(SOURCES[sig.src]||sig.src)});
      try {
        const reg = S.settings.region && !/global/i.test(S.settings.region) ? S.settings.region.split('+')[0].trim() : '';
        const q = reg && /news|jobs|web|events|tenders/.test(sig.src) ? sig.query+' '+reg : sig.query;
        let res = await search(q, sig.src);
        if (res.length < 3 && sig.src !== 'web') res = res.concat(await search(sig.query, 'web'));
        res = res.slice(0, 14);
        log(`${sig.id}: ${res.length} results from ${SOURCES[sig.src]||sig.src}`);
        if (RUN.stop) break;
        if (!res.length){ setRow(sig.id, {state:'ok', note:'no results found', leads:0}); continue; }
        setRow(sig.id, {note:'reading '+res.length+' results'});
        const out = await ask(P.extract(sig, res, S.business));
        const urls = new Map(res.map(r=>[r.url, r]));
        let n = 0;
        for (const L of (out.leads||[])){
          if (!urls.has(L.url)){ log(`${sig.id}: dropped "${L.company}", link not in results`); continue; }
          if (!L.date && urls.get(L.url).date) L.date = urls.get(L.url).date;
          const a = mergeLead(L, sig, urls.get(L.url).title);
          if (a){ n++; if (!RUN.found.includes(a.id)) RUN.found.push(a.id); renderLive(); }
        }
        for (const N of (out.noise||[])){ S.rejected.push({company:N.company, sid:sig.id, reason:N.reason, url:N.url}); RUN.rejectedNow++; }
        setRow(sig.id, {state:'ok', note:n?'done':'done, nothing kept', leads:n}); log(`${sig.id}: ${n} leads kept, ${(out.noise||[]).length} rejected`);
        save();
      } catch(e){ setRow(sig.id, {state:'err', note:String(e.message||e).slice(0,90)}); log(`${sig.id}: ${e.message||e}`); }
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  RUN.rows.forEach(r => { if (!r.state || r.state==='busy') { r.state='err'; r.note='stopped'; } });
  RUN.busy = false; S.runAt = new Date().toISOString().slice(0,16).replace('T',' ');
  const top = ranked()[0]; if (top) S.sel = top.a.id;
  log(`Done. ${RUN.found.length} buyers found, ${RUN.rejectedNow} rejected.`); render();
}

async function findPeople(){
  const acc = S.accounts.find(a=>a.id===S.sel); if (!acc || RUN.busy) return;
  RUN.busy = true; render(); const st = m => { const el=$('#peopleStatus'); if(el) el.textContent=m; };
  try {
    st('Searching public profiles and the company website…');
    const g = segById(acc.seg);
    const roleList = g ? g.buyer.split(/,| or /).map(r=>r.trim()).filter(Boolean).slice(0,5) : ['Head of Research','Head of Design','Head of Product','Founder'];
    const roles = '(' + roleList.map(r=>'"'+r+'"').join(' OR ') + ')';
    const [li, web] = await Promise.all([search(`"${acc.company}" ${roles}`, 'linkedin'), search(`${acc.company} leadership team ${acc.domain||''}`, 'web')]);
    const sources = li.slice(0,10).map(r=>({title:r.title, url:r.url, text:r.title+'. '+r.content}));
    let domain = acc.domain || (web.find(r=>r.url && !/linkedin|wikipedia|crunchbase|glassdoor|naukri/.test(r.url))||{}).url;
    if (domain){
      const base = domain.startsWith('http') ? domain : 'https://'+domain;
      const home = await readPage(base);
      const links = (home.peopleLinks||[]).filter(l=>/team|about|leadership|people|founder/i.test(l.url+l.text)).slice(0,3);
      if (!links.length) links.push({url:base.replace(/\/$/,'')+'/about'});
      for (const l of links){ const pg = await readPage(l.url); if (pg.text) sources.push({title:pg.title||l.url, url:pg.url||l.url, text:pg.text}); }
    }
    for (const r of web.slice(0,4)) sources.push({title:r.title, url:r.url, text:r.title+'. '+r.content});
    if (!sources.length){ st('No public sources found. Use the LinkedIn searches below.'); return; }
    st(`Reading ${sources.length} sources…`);
    const out = await ask(P.people(acc, S.business, sources));
    const byUrl = new Map(sources.map(s=>[s.url, s]));
    const kept = (out.people||[]).filter(p => { const s = byUrl.get(p.source_url); return s && s.text.toLowerCase().includes(String(p.name).split(' ')[0].toLowerCase()); })
      .map(p => ({...p, source:host(p.source_url), linkedin: /linkedin\.com\/in\//.test(p.linkedin||p.source_url) ? (p.linkedin||p.source_url) : ''}));
    const prev = S.people[acc.id] || [];
    S.people[acc.id] = [...prev, ...kept.filter(k=>!prev.some(x=>x.name===k.name))];
    st(`${kept.length} people verified against their sources${(out.people||[]).length>kept.length?`, ${(out.people||[]).length-kept.length} dropped because the name was not in the source`:''}.`);
  } catch(e){ st(e.message||String(e)); }
  finally { RUN.busy = false; render(); }
}

async function writeOutreach(){
  const [aid, pname] = String(S.personSel).split('::');
  const acc = S.accounts.find(a=>a.id===aid), p = (S.people[aid]||[]).find(x=>x.name===pname);
  if (!acc || !p || RUN.busy) return;
  RUN.busy = true; render(); const el = $('#writeStatus'); if (el) el.textContent = 'Writing from the evidence…';
  try {
    const o = await ask(P.outreach(acc, p, S.business));
    if (!o.messages) throw new Error('The AI reply had no messages. Try again.');
    o.plan = o.plan || {first:'LinkedIn', why:'', sequence:[]};
    S.outreach[S.personSel] = o; S.msgTab = 'linkedin_invite';
  } catch(e){ RUN.busy=false; render(); const el2=$('#writeStatus'); if(el2) el2.textContent = e.message||String(e); return; }
  RUN.busy = false; render();
}

async function scorePaste(){
  const t = ($('#pasteSig')||{}).value || ''; const st = $('#pasteStatus'), out = $('#pasteOut');
  if (t.trim().length < 30){ st.textContent = 'Paste a bit more: the text of the post and its link.'; return; }
  st.textContent = 'Scoring…';
  try {
    const r = await ask(P.score(t, S.business));
    const sig = sigById(r.sid);
    if (r.verdict !== 'lead'){
      S.rejected.unshift({company:r.company||'Pasted signal', sid:r.sid, reason:r.reason, url:r.url});
      out.innerHTML = `<div class="reject"><b>Noise: ${esc(r.company||'')}</b><span class="small">${esc(r.reason)}</span></div>`; st.textContent=''; save(); return;
    }
    const a = mergeLead({...r, url:r.url||'#pasted-'+Date.now()}, sig, r.url?host(r.url):'Pasted by sales');
    if (!a){ st.textContent='Rejected by the noise filter.'; render(); return; }
    if (S.source==='demo') S.source='mixed';
    S.sel = a.id; st.textContent='';
    const h = heat(a);
    out.innerHTML = `<div class="row" style="flex-wrap:nowrap;gap:12px;align-items:flex-start"><span class="heat h-${band(h.v)}">${h.v}<small>${BAND_LABEL[band(h.v)]}</small></span>
      <div><b style="color:var(--ink)">${esc(a.company)}</b> ${sigChip(r.sid)}<p class="small" style="margin:4px 0">${esc(r.why_now||r.what)}</p>
      <button class="btn-link" data-go="accounts">Open in Accounts</button></div></div>`;
    save(); renderRail();
  } catch(e){ st.textContent = e.message||String(e); }
}

async function buildProfile(){
  const v = ($('#bizIn')||{}).value||''; const st = $('#bizStatus');
  if (!v.trim()){ st.textContent='Type a website or product first.'; return; }
  st.textContent = 'Reading the business…';
  try {
    let site = '';
    if (ENV.backend && /\.[a-z]{2,}/i.test(v) && !/\s/.test(v.trim())){ const pg = await readPage(v.trim()); site = pg.text||''; }
    const p = await ask(P.profile(v, site), 'complex');
    if (!Array.isArray(p.signals) || !p.signals.length) throw new Error('No signals came back. Try again with the website address.');
    S.business = {...RM_BUSINESS, ...p, customers:[], sender:S.settings.sender, segments:(p.segments||[]).map(g=>({...g, value:+g.value||3})), competitors:p.competitors||[], pains:p.pains||[]};
    S.signals = p.signals.map((s,i)=>({id:s.id||'S'+(i+1), tier:s.tier||'B', on:true, src:SOURCES[s.src]?s.src:'web', name:s.name, why:s.why, query:s.query, segs:Array.isArray(s.segs)?s.segs:[], lead:s.lead||'', earliness:+s.earliness||3, intent:+s.intent||3, noise:s.noise||''}));
    S.noise = p.noise && p.noise.length ? p.noise : RM_NOISE;
    S.accounts=[]; S.rejected=[]; S.people={}; S.outreach={}; S.source='live'; S.view='playbook';
    render(); toast('Playbook built');
  } catch(e){ st.textContent = e.message||String(e); }
}

      <span class="hint">Claude and Gemini keys can search the web themselves. Other keys use free search only.</span></div>
    <div class="field"><label for="sSender">Sign messages as</label><input id="sSender" type="text" value="${esc(s.sender)}"></div>
    <div class="row" style="justify-content:space-between;border-top:1px solid var(--border);padding-top:12px"><span class="small muted">Start over with the verified ResearchMind run.</span><button type="button" class="btn btn-ghost btn-sm" data-act="reset">Restore sample</button></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-ghost" data-act="closeModal">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div>
  </form></div>`;
  $('#setForm').addEventListener('submit', e => {
    e.preventDefault();
    const key = $('#sKey').value.trim(); let prov = $('#sProv').value;
    if (prov==='auto' && key) prov = guessKind(key);
    S.settings = {...S.settings, key, provider:prov, model:$('#sModel').value.trim(), sender:$('#sSender').value.trim(), searchMode:$('#sSearch').value};
    $('#layer').innerHTML=''; updatePill(); render(); toast('Saved');
  });
}
function confirmReset(){
  $('#layer').innerHTML = `<div class="scrim" data-act="closeModal"><div class="modal">
    <h3 style="font-size:17px">Reset to the ResearchMind sample?</h3><p class="small" style="margin:0">Your playbook edits, scouted accounts, people and messages are replaced by the verified sample run. Your settings stay.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-act="closeModal">Keep my work</button><button class="btn btn-primary" data-act="doReset">Reset</button></div></div></div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-acc],[data-acc-open],[data-filter],[data-tab]'); if (!t) return;
  if (t.tagName==='SELECT') return;
  if (t.dataset.go){ S.view = t.dataset.go; render(); window.scrollTo(0,0); return; }
  if (t.dataset.acc){ S.sel = t.dataset.acc; render(); return; }
  if (t.dataset.accOpen){ S.sel = t.dataset.accOpen; S.view='accounts'; S.filter='all'; render(); window.scrollTo(0,0); return; }
  if (t.dataset.filter){ S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.tab){ S.msgTab = t.dataset.tab; render(); return; }
  const a = t.dataset.act, i = +t.dataset.i;
  if (a==='closeModal'){ if (e.target===t || t.tagName==='BUTTON') $('#layer').innerHTML=''; return; }
  if (a==='tog'){ S.signals[i].on = !S.signals[i].on; render(); }
  if (a==='seginc'||a==='segdec'){ const g=S.business.segments[i]; g.value=Math.max(1,Math.min(5,g.value+(a==='seginc'?1:-1))); render(); }
  if (a==='inc'||a==='dec'){ const k=t.dataset.k; S.signals[i][k] = Math.max(1, Math.min(5, S.signals[i][k] + (a==='inc'?1:-1))); render(); }
  if (a==='settings') settingsModal();
  if (a==='help') helpModal();
  if (a==='reset') confirmReset();
  if (a==='doReset'){ const keep=S.settings; S = blank(); S.settings=keep; $('#layer').innerHTML=''; render(); toast('Sample restored'); }
  if (a==='scout') runScout();
  if (a==='stopScout'){ RUN.stop = true; toast('Stopping after the current searches'); }
  if (a==='pick'){ S.signals[i].on = t.checked; render(); }
  if (a==='pickAll'){ S.signals.forEach(x=>x.on=true); render(); }
  if (a==='pickA'){ S.signals.forEach(x=>x.on=x.tier==='A'); render(); }
  if (a==='pickNone'){ S.signals.forEach(x=>x.on=false); render(); }
  if (a==='delSig'){ e.preventDefault(); S.signals.splice(i,1); render(); }
  if (a==='addSig'){
    const name=$('#cName').value.trim(), query=$('#cQuery').value.trim(), tier=$('#cTier').value;
    if (!name || !query){ $('#cStatus').textContent='Give the signal a name and some search words.'; return; }
    const n = S.signals.filter(x=>x.custom).length + 1;
    S.signals.push({id:'Y'+n, custom:true, tier, on:true, src:$('#cSrc').value, segs:[$('#cSeg').value], name, query,
      why:'Added by the sales team.', lead:'', earliness:tier==='A'?4:3, intent:tier==='A'?5:tier==='B'?4:3, noise:'Vendors, recruiters and anything older than 12 months.'});
    render(); toast('Signal added and selected');
  }
  if (a==='saveKey'){ const k=$('#keyIn').value.trim(); if(!k){ toast('Paste a key first'); return; } S.settings.key=k; S.settings.provider=guessKind(k); updatePill(); render(); toast(ENV.backend?'Key saved':'Key saved. It is used on your deployed site.'); }
  if (a==='clearKey'){ S.settings.key=''; S.settings.provider='auto'; updatePill(); render(); toast('Key removed'); }
  if (a==='findPeople') findPeople();
  if (a==='write') writeOutreach();
  if (a==='scorePaste') scorePaste();
  if (a==='buildProfile') buildProfile();
  if (a==='toPeople'){ S.sel = t.dataset.id; S.view='people'; render(); window.scrollTo(0,0); }
  if (a==='toOutreach'){ S.personSel = t.dataset.key; S.view='outreach'; S.msgTab='linkedin_invite'; render(); window.scrollTo(0,0); }
  if (a==='dropAcc'){ const ac=S.accounts.find(x=>x.id===t.dataset.id); if(ac){ S.rejected.unshift({company:ac.company, reason:'Marked as noise by sales.', url:(ac.ev[0]||{}).url}); S.accounts=S.accounts.filter(x=>x!==ac); S.sel=(ranked()[0]||{a:{}}).a.id; render(); } }
  if (a==='copyMsg') copy(($('#msgBody')||{}).textContent||'');
  if (a==='copyMd') copy(toMarkdown());
  if (a==='copyJson') copy(JSON.stringify({recipe:'who-buys-next/v1', business:S.business, signals:S.signals, weights:S.weights, stack:S.stack, noise:S.noise}, null, 2));
  if (a==='csv') copy(toCSV());
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.w){ if (t.dataset.w==='stack') S.stack = +t.value; else S.weights[t.dataset.w] = +t.value;
    const lab = t.nextElementSibling; if (lab) lab.textContent = t.dataset.w==='stack' ? '+'+S.stack : t.value;
    const w=S.weights, f=document.querySelector('.formula'); if (f) f.innerHTML = `Heat = ( ${w.intent}·Intent + ${w.early}·Earliness + ${w.fit}·Fit + ${w.fresh}·Freshness ) ÷ ${w.intent+w.early+w.fit+w.fresh} ÷ 5 × 100<br>+${S.stack} for each extra signal at the same company (max 2) · capped at 100<br>HOT ≥ 75 · WARM 55–74 · WATCH &lt; 55`;
    save(); }
  if (t.dataset.set){ S.settings[t.dataset.set] = t.value; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.w) renderRail();
  if (t.id==='accPick'){ S.sel = t.value; render(); }
  if (t.id==='personPick'){ S.personSel = t.value; render(); }
  if (t.id==='sSearch2'){ S.settings.searchMode = t.value; save(); }
});
document.addEventListener('focusout', e => {
  const t = e.target; if (t.dataset && t.dataset.q!=null){ S.signals[+t.dataset.q].query = t.textContent.trim(); save(); }
});

function updatePill(){
  const el = $('#modePill');
  if (ENV.backend){ el.className='pill p-live'; el.innerHTML='<span class="dot"></span>Live'+(aiReady()?(aiSearchReady()?' · search + AI':' · AI ready'):' · add your API key'); }
  else if (ENV.sample){ el.className='pill p-ai'; el.innerHTML='<span class="dot"></span>Preview · AI via Claude'; }
  else { el.className='pill p-demo'; el.innerHTML='<span class="dot"></span>Verified sample run'; }
}

(async function boot(){
  render();
  try {
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 3500);
    const r = await fetch('api/ok', {signal:ctl.signal}); clearTimeout(tm);
    if (r.ok){ const j = await r.json(); if (j.ok){ ENV.backend = true; ENV.serverAI = Object.values(j.providers||{}).some(Boolean); ENV.serverSearch = !!(j.providers && (j.providers.claude || j.providers.gemini)); } }
  } catch(e){}
  if (!ENV.backend && window.claude && typeof window.claude.use === 'function'){
    try { ENV.sample = await window.claude.use('sample'); } catch(e){ ENV.sample = null; }
  }
  updatePill(); render();
})();
</script>

</body>
</html>
