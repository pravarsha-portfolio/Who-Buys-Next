<title>Who Buys Next</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a guided path. Sticky stepper on top, one step per screen, and every screen split into
   "Your input" zones (lavender, dashed, editable) and "Result" zones (white, solid, read and act).
   Bright single theme by choice, matching the ResearchMind prototype. */
:root{
  color-scheme:light;
  --bg:#F6F5FD; --card:#FFFFFF; --surface:#F9F8FE; --border:#E3E0F3; --border-strong:#CFCAE8;
  --ink:#1A1446; --body:#3C3A55; --muted:#6B6888;
  --purple:#534AB7; --purple-hover:#463DA3; --purple-soft:#EEEBFF; --purple-ink:#3B3394; --mid:#818CF8;
  --in-bg:#F2EFFF; --in-border:#BDB4F2; --in-ink:#4338CA;
  --out-ink:#047857; --out-bg:#D1FAE5;
  --hot:#DC2626; --hot-bg:#FEE2E2; --warm:#B45309; --warm-bg:#FEF3C7; --watch:#1D4ED8; --watch-bg:#DBEAFE;
  --grey-bg:#F0EEF7;
  --shadow:0 1px 2px rgba(26,20,70,.05), 0 6px 20px rgba(26,20,70,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--body); font-family:var(--sans); font-size:14.5px; line-height:1.55; margin:0}
button,input,textarea,select{font:inherit; color:inherit}
a{color:var(--purple)}
:focus-visible{outline:2px solid var(--purple); outline-offset:2px; border-radius:6px}
h1,h2,h3,h4{color:var(--ink); margin:0; text-wrap:balance; line-height:1.25}
p{margin:0}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.stack{display:grid; gap:12px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.sep{height:1px; background:var(--border)}

/* ---------- Header + stepper ---------- */
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--card)}
.chrome{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--card); border-bottom:1px solid var(--border); box-shadow:0 2px 10px rgba(26,20,70,.04)}
.bar{max-width:1240px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex; align-items:center; gap:12px; padding-block:10px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0}
.logo{width:32px; height:32px; border-radius:9px; background:var(--purple); display:grid; place-items:center; flex:none}
.brand h1{font-size:15.5px; font-weight:750}
.brand p{font-size:12px; color:var(--muted)}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:650; white-space:nowrap}
.pill .dot{width:7px; height:7px; border-radius:50%; background:currentColor}
.p-live{background:var(--out-bg); color:var(--out-ink)}
.p-demo{background:var(--warm-bg); color:var(--warm)}
.p-ai{background:var(--purple-soft); color:var(--purple-ink)}

.steps{display:flex; gap:0; overflow-x:auto; padding-block:2px 0; scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stp{flex:1 0 auto; display:flex; align-items:center; gap:9px; padding:10px 14px 12px; border:none; background:none; cursor:pointer; color:var(--muted);
  border-bottom:3px solid transparent; text-align:left; position:relative}
.stp:hover{color:var(--ink)}
.stp .n{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--grey-bg); color:var(--muted); flex:none}
.stp b{display:block; font-size:13.5px; font-weight:650; white-space:nowrap}
.stp small{display:block; font-size:11.5px; white-space:nowrap}
.stp.on{color:var(--ink); border-bottom-color:var(--purple)}
.stp.on .n{background:var(--purple); color:#fff}
.stp.done .n{background:var(--out-bg); color:var(--out-ink)}
.stp .badge{font-family:var(--mono); font-size:10.5px; background:var(--purple-soft); color:var(--purple-ink); border-radius:99px; padding:0 6px; margin-left:2px}

/* ---------- Page ---------- */
.main{max-width:1240px; margin:0 auto; padding-block:26px 40px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:grid; gap:18px}
.phead{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap}
.phead h2{font-size:25px; font-weight:780; letter-spacing:-.015em}
.phead p{margin-top:6px; max-width:70ch; color:var(--muted); font-size:15px}
.eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--purple); font-weight:600}
.legend{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- Zones: the input/output language ---------- */
.zone{border-radius:var(--r); padding:18px; display:grid; gap:14px; min-width:0}
.zone.in{background:var(--in-bg); border:1.5px dashed var(--in-border)}
.zone.out{background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow)}
.zh{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap}
.zh h3{font-size:16.5px; font-weight:720; margin-top:6px}
.zh p{font-size:13.5px; color:var(--muted); margin-top:3px; max-width:68ch}
.ztag{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:3px 9px 3px 7px; border-radius:6px; font-family:var(--mono)}
.ztag svg{width:13px; height:13px}
.ztag.in{background:var(--purple); color:#fff}
.ztag.out{background:var(--out-bg); color:var(--out-ink)}
.zone.in .card-in{background:var(--card); border:1px solid var(--in-border); border-radius:10px}

/* ---------- Buttons + fields ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:9px; padding:9px 16px; font-size:13.5px; font-weight:650;
  border:1px solid transparent; cursor:pointer; transition:background .15s,border-color .15s,box-shadow .15s; white-space:nowrap; text-decoration:none}
.btn-primary{background:var(--purple); color:#fff; box-shadow:0 2px 6px rgba(83,74,183,.25)}
.btn-primary:hover{background:var(--purple-hover)}
.btn-primary:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
.btn-outline{background:var(--card); color:var(--purple); border-color:var(--purple)}
.btn-outline:hover{background:var(--purple-soft)}
.btn-outline:disabled{opacity:.45; cursor:not-allowed}
.btn-ghost{background:var(--card); color:var(--body); border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--surface)}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px}
.btn-lg{padding:12px 20px; font-size:15px}
.btn-link{background:none; border:none; color:var(--purple); padding:0; font-weight:650; cursor:pointer; font-size:13px}
.field{display:grid; gap:6px}
.field label{font-size:13px; font-weight:650; color:var(--ink)}
.field .hint{font-size:12px; color:var(--muted)}
input[type=text],input[type=password],textarea,select{width:100%; background:var(--card); border:1.5px solid var(--border-strong); border-radius:9px; padding:9px 11px; font-size:14px}
select{width:auto; min-width:220px; max-width:100%}
textarea{resize:vertical; min-height:90px}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--purple); box-shadow:0 0 0 3px var(--purple-soft)}
.status{font-size:13px; color:var(--muted)}
.status.busy::before{content:""; display:inline-block; width:11px; height:11px; border:2px solid var(--purple); border-top-color:transparent; border-radius:50%; margin-right:7px; vertical-align:-1px; animation:spin .8s linear infinite}

/* ---------- Chips ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:6px; font-size:11.5px; font-weight:650; white-space:nowrap; line-height:1.6}
.c-a{background:var(--purple); color:#fff}
.c-b{background:var(--purple-soft); color:var(--purple-ink)}
.c-c{background:var(--grey-bg); color:var(--muted)}
.c-src{background:var(--card); color:var(--body); border:1px solid var(--border-strong); font-family:var(--mono); font-weight:500; font-size:11px}
.c-sig{background:var(--watch-bg); color:var(--watch); font-family:var(--mono); font-size:11px}
.c-seg{background:#FDF2F8; color:#9D174D}
.c-grey{background:var(--grey-bg); color:var(--muted)}
.c-red{background:var(--hot-bg); color:var(--hot)}
.role-champ{background:var(--out-bg); color:var(--out-ink)}
.role-eval{background:var(--watch-bg); color:var(--watch)}
.role-budget{background:var(--purple-soft); color:var(--purple-ink)}

/* ---------- Heat ---------- */
.heat{display:inline-grid; place-items:center; width:52px; height:52px; border-radius:14px; font-weight:800; font-size:18px; font-variant-numeric:tabular-nums; flex:none; position:relative}
.heat small{position:absolute; bottom:-8px; font-size:9px; font-family:var(--mono); letter-spacing:.06em; padding:0 5px; border-radius:4px; background:var(--card); border:1px solid currentColor}
.h-hot{background:var(--hot-bg); color:var(--hot); box-shadow:inset 0 0 0 2px var(--hot)}
.h-warm{background:var(--warm-bg); color:var(--warm)}
.h-watch{background:var(--watch-bg); color:var(--watch)}
@media (prefers-reduced-motion:no-preference){ .h-hot{animation:pulse 2.4s ease-in-out infinite} }
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 2px var(--hot)} 50%{box-shadow:inset 0 0 0 2px var(--hot),0 0 0 4px var(--hot-bg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Step 1 ---------- */
.prod{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:14px; }
.prod .mark{width:44px; height:44px; border-radius:11px; background:var(--purple); color:#fff; display:grid; place-items:center; font-weight:800}
.callout{background:var(--purple-soft); border-radius:10px; padding:12px 14px; color:var(--ink); font-weight:550}
.seg{border:1px solid var(--border); border-radius:10px; padding:14px; display:grid; gap:8px; background:var(--card); align-content:start}
.seg h4{font-size:14.5px}
.seg .kv{display:grid; grid-template-columns:52px 1fr; gap:6px; font-size:13px}
.seg .kv span:first-child{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding-top:2px}
.seg .buy{color:var(--ink); font-weight:650}
.value{display:inline-flex; gap:3px}
.value i{width:8px; height:8px; border-radius:2px; background:var(--border-strong)}
.value i.on{background:var(--purple)}

/* ---------- Step 2: signal cards ---------- */
.tier{display:grid; gap:8px}
.tier-h{display:flex; align-items:baseline; gap:10px}
.tier-h h4{font-size:14px}
.sig{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:start; padding:12px 14px; background:var(--card); border:1px solid var(--in-border); border-radius:10px}
.sig.off{opacity:.55; background:var(--surface)}
.sig .nm{font-weight:680; color:var(--ink); font-size:14px}
.sig .why{font-size:13px; margin-top:2px}
.sig details{grid-column:2 / -1}
.sig summary{cursor:pointer; font-size:12.5px; font-weight:650; color:var(--purple); list-style:none; display:inline-flex; gap:5px; align-items:center}
.sig summary::-webkit-details-marker{display:none}
.sig summary::before{content:"▸"; transition:transform .15s}
.sig details[open] summary::before{transform:rotate(90deg)}
.adv{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border-strong)}
.adv .q{font-family:var(--mono); font-size:12px; background:var(--surface); border:1.5px solid var(--border-strong); border-radius:8px; padding:7px 9px; word-break:break-word; min-height:34px}
.adv .q:focus{outline:none; border-color:var(--purple); background:var(--card)}
.toggle{width:38px; height:22px; border-radius:999px; border:none; background:var(--border-strong); position:relative; cursor:pointer; flex:none; margin-top:1px}
.toggle::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--purple)}
.toggle.on::after{left:19px}
.stepper{display:inline-flex; align-items:center; border:1.5px solid var(--border-strong); border-radius:8px; overflow:hidden; background:var(--card)}
.stepper button{border:none; background:var(--surface); width:26px; height:28px; cursor:pointer; color:var(--body); font-weight:700}
.stepper button:hover{background:var(--purple-soft)}
.stepper span{width:28px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}
details.tune > summary{cursor:pointer; list-style:none}
details.tune > summary::-webkit-details-marker{display:none}
.wrow{display:grid; grid-template-columns:110px 1fr 44px; gap:12px; align-items:center}
input[type=range]{accent-color:var(--purple); width:100%}
.formula{font-family:var(--mono); font-size:12.5px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:12px; color:var(--ink); line-height:1.75; overflow-x:auto}
.bands{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- Step 3 ---------- */
.run{display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:center; padding:9px 12px; border:1px solid var(--border); border-radius:9px; background:var(--card)}
.run .st{width:18px; height:18px; border-radius:50%; border:2px solid var(--border-strong)}
.run.busy .st{border-color:var(--purple); border-top-color:transparent; animation:spin .8s linear infinite}
.run.ok .st{background:var(--out-ink); border-color:var(--out-ink)}
.run.err .st{background:var(--hot); border-color:var(--hot)}
.log{font-family:var(--mono); font-size:11.5px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px 12px; max-height:200px; overflow:auto; display:grid; gap:3px}
.note{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px; background:var(--warm-bg); color:var(--ink); font-size:13.5px}
.note.info{background:var(--watch-bg)}
.note svg{flex:none; margin-top:2px}

/* ---------- Step 4 ---------- */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.kpi{padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); display:flex; gap:12px; align-items:center}
.kpi i{width:10px; height:34px; border-radius:4px; flex:none}
.kpi b{display:block; font-size:22px; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.1}
.kpi span{font-size:12.5px; color:var(--muted)}
.filters{display:flex; gap:6px; flex-wrap:wrap}
.fbtn{border:1.5px solid var(--in-border); background:var(--card); border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:650; cursor:pointer; color:var(--body)}
.fbtn:hover{border-color:var(--purple)}
.fbtn.on{background:var(--purple); color:#fff; border-color:var(--purple)}
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:16px; align-items:start}
.acc{display:grid; grid-template-columns:auto 1fr; gap:14px; padding:14px; border:1px solid var(--border); border-radius:11px; background:var(--card); cursor:pointer; text-align:left; width:100%; transition:border-color .15s, box-shadow .15s}
.acc:hover{border-color:var(--border-strong); box-shadow:var(--shadow)}
.acc.sel{border-color:var(--purple); box-shadow:0 0 0 3px var(--purple-soft)}
.acc h4{font-size:15px; font-weight:720}
.acc p{margin-top:4px; font-size:13px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.detail{position:sticky; top:150px}
.sbar{display:grid; grid-template-columns:86px 1fr 40px; gap:10px; align-items:center; font-size:13px}
.sbar .track{height:8px; background:var(--grey-bg); border-radius:99px; overflow:hidden}
.sbar .fill{height:100%; background:var(--purple); border-radius:99px}
.ev{display:grid; grid-template-columns:14px 1fr; gap:12px; padding:8px 0}
.ev .pin{width:10px; height:10px; border-radius:50%; background:var(--purple); margin-top:6px; box-shadow:0 0 0 3px var(--purple-soft)}
.ev h5{margin:4px 0 2px; font-size:13.5px; color:var(--ink); font-weight:600}
.ev a{font-size:12.5px; word-break:break-word}
.why{background:var(--purple-soft); border-radius:9px; padding:10px 12px; color:var(--ink)}
.reject{display:grid; gap:4px; padding:10px 12px; border-radius:9px; background:var(--surface); border:1px dashed var(--border-strong)}
.reject s{color:var(--muted)}

/* ---------- Step 5 + 6 ---------- */
.person{display:grid; grid-template-columns:44px 1fr; gap:12px; padding:14px; border:1px solid var(--border); border-radius:11px; background:var(--card)}
.ava{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-weight:750; background:var(--purple-soft); color:var(--purple-ink)}
.ava.ghost{background:var(--surface); color:var(--muted); border:1.5px dashed var(--border-strong)}
.person h4{font-size:15px}
.seq .it{display:grid; grid-template-columns:64px 1fr; gap:12px; padding:9px 0; border-bottom:1px dashed var(--border)}
.seq .it:last-child{border-bottom:none}
.seq .day{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--purple-ink); background:var(--purple-soft); border-radius:6px; padding:3px 6px; text-align:center; align-self:start}
.tabs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:4px; overflow-x:auto}
.tab{border:none; background:none; padding:7px 12px; font-weight:650; font-size:13px; color:var(--muted); cursor:pointer; border-radius:7px; white-space:nowrap}
.tab.on{background:var(--card); color:var(--purple); box-shadow:0 1px 3px rgba(26,20,70,.1)}
.msg{white-space:pre-wrap; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; font-size:14px; color:var(--ink); line-height:1.65}
.meta{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--muted)}

/* ---------- Footer nav, empty, modal ---------- */
.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding-top:8px; border-top:1px solid var(--border); margin-top:6px}
.empty{display:grid; place-items:center; text-align:center; gap:10px; padding:32px 18px; border:1.5px dashed var(--border-strong); border-radius:var(--r); color:var(--muted); background:var(--card)}
.empty h3{color:var(--ink); font-size:16px}
.scrim{position:fixed; inset:0; background:rgba(26,20,70,.4); display:grid; place-items:center; z-index:50; padding:16px}
.modal{background:var(--card); border-radius:16px; width:min(560px,100%); max-height:90vh; overflow:auto; padding:22px; display:grid; gap:14px; border:1px solid var(--border)}
.toast{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:9px; font-size:13.5px; font-weight:650; z-index:60}
.tbl-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--card)}
table{border-collapse:collapse; width:100%; min-width:620px}
th{text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:9px 12px; background:var(--surface); border-bottom:1px solid var(--border)}
td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; font-size:13px}
tr:last-child td{border-bottom:none}
ol.clean{margin:0; padding-left:18px; display:grid; gap:6px}

@media (max-width:1000px){ .split{grid-template-columns:1fr} .detail{position:static} .grid3{grid-template-columns:1fr 1fr} .adv{grid-template-columns:1fr 1fr} }
@media (max-width:760px){
  .grid2,.grid3,.adv{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .brand p,.stp small{display:none}
  .stp{padding:9px 10px 11px}
  .phead h2{font-size:21px}
  .sig{grid-template-columns:auto 1fr}
  .sig > .row:last-child{grid-column:2}
  .prod{grid-template-columns:auto 1fr}
  .prod > :last-child{grid-column:1 / -1}
}
/* ---------- Scout: signal picker, run bar, live feed ---------- */
.picks{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.pick{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:start; padding:10px 12px; background:var(--card); border:1.5px solid var(--border); border-radius:10px; cursor:pointer}
.pick:hover{border-color:var(--in-border)}

/* ---------- Scoring ---------- */
function freshScore(date){
  if (!date) return 3;
  const d = new Date(date); if (isNaN(d)) return 3;
  const days = (TODAY - d) / 864e5;
  if (days <= 30) return 5; if (days <= 90) return 4; if (days <= 180) return 3; if (days <= 365) return 2; return 0;
}
function evScore(e, acc){
  const sig = sigById(e.sid), w = S.weights, tot = w.intent + w.early + w.fit + w.fresh || 1;
  const g = segById(acc.seg); const fit = g ? ((+acc.fit||3) + g.value) / 2 : (+acc.fit||3);
  const parts = {intent:+e.intent || sig.intent, early:sig.earliness, fit, fresh:freshScore(e.date)};
  const v = (w.intent*parts.intent + w.early*parts.early + w.fit*parts.fit + w.fresh*parts.fresh) / tot / 5 * 100;
  return {v, parts};
}
function heat(acc){
  const live = (acc.ev||[]).filter(e => sigById(e.sid).on !== false && freshScore(e.date) > 0);
  if (!live.length) return {v:0, best:null, distinct:0, parts:{}};
  let best = null;
  for (const e of live){ const s = evScore(e, acc); if (!best || s.v > best.v) best = {...s, e}; }
  const distinct = new Set(live.map(e => e.sid)).size;
  const v = Math.min(100, Math.round(best.v + S.stack * Math.min(2, distinct - 1)));
  return {v, best:best.e, parts:best.parts, distinct, base:Math.round(best.v)};
}

/* Close a JSON answer that was cut off mid-way: keep every complete item, drop the half-written one. */
function repairJSON(t){
  const start = t.search(/[\[{]/); if (start < 0) throw new Error('no JSON');
  t = t.slice(start);
  const stack = []; let inStr = false, esc = false, lastGood = -1, goodStack = [];
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (inStr){ if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
    if (c === '"'){ inStr = true; continue; }
    if (c === '{' || c === '['){ stack.push(c); continue; }
    if (c === '}' || c === ']'){ stack.pop(); lastGood = i; goodStack = stack.slice(); if (!stack.length) return JSON.parse(t.slice(0, i+1)); }
  }
  if (lastGood < 0) throw new Error('unrecoverable');
  let out = t.slice(0, lastGood+1).replace(/,\s*$/, '');
  for (let k = goodStack.length - 1; k >= 0; k--) out += goodStack[k] === '{' ? '}' : ']';
  return JSON.parse(out);
}
function parseJSON(t){
  if (typeof t !== 'string') return t;
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) t = f[1];
  try { return JSON.parse(t); } catch(e){}
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); const c = t.indexOf('['), d = t.lastIndexOf(']');
  const cand = (a > -1 && (c === -1 || a < c)) ? t.slice(a, b+1) : t.slice(c, d+1);
  try { return JSON.parse(cand); } catch(e){}
  return repairJSON(t);
}

/* Free search and your key's web search run side by side. Free search engines often block cloud servers,
   so relying on them alone returns nothing for many queries. */
async function search(q, src){
  const mode = S.settings.searchMode || 'auto';
  const useAI = mode !== 'free' && aiSearchReady();
  const useFree = mode !== 'ai' || !useAI;
  const [free, ai] = await Promise.all([useFree ? freeSearch(q, src) : [], useAI ? aiSearch(q, src) : []]);
  const seen = new Set(), out = [];
  for (const r of [...ai, ...free]) if (r && r.url && !seen.has(r.url)){ seen.add(r.url); out.push(r); }
  if (typeof log==='function' && RUN.busy) log(`  "${q.slice(0,60)}" → ${free.length} free + ${ai.length} AI results`);
  return out;
}

  const counts = {find:S.signals.filter(s=>s.on).length, buyers:ranked().length, outreach:Object.keys(S.outreach).length};

  $('#rail').innerHTML = STEPS.map((s,i) => `

}

          <div class="field"><label>How early it appears</label>${stepper(i,'earliness',s.earliness)}</div>

buyers(){
  const all = ranked();
  const f = S.filter;
  const list = all.filter(x => f==='all' || band(x.h.v)===f || x.a.seg===f);
  const sel = S.accounts.find(a=>a.id===S.sel && list.some(x=>x.a.id===a.id)) || (list[0]&&list[0].a);
  if (sel) S.sel = sel.id;
  const counts = {hot:0,warm:0,watch:0}; all.forEach(x=>counts[band(x.h.v)]++);
  return phead(3, 'Buyers', 'Hottest first. Pick one to see why it scored, the evidence, and the people to contact.',
    `<button class="btn btn-ghost btn-sm" data-act="csv">Copy as CSV</button>`) +
  `<div class="filters">${[['all','All '+all.length],['hot','Hot '+counts.hot],['warm','Warm '+counts.warm],['watch','Watch '+counts.watch],...S.business.segments.filter(g=>all.some(x=>x.a.seg===g.id)).map(g=>[g.id,g.name])].map(([k,l])=>`<button class="fbtn ${f===k?'on':''}" data-filter="${k}">${esc(l)}</button>`).join('')}</div>` +
  (list.length?`<div class="split">
    <div class="stack" style="gap:10px">${list.map(({a,h})=>`<button class="acc ${sel&&sel.id===a.id?'sel':''}" data-acc="${a.id}">
      ${heatBox(h.v)}
      <span style="min-width:0"><span class="row" style="justify-content:space-between"><h4>${esc(a.company)}</h4><span class="small muted">${(S.people[a.id]||[]).length?`${(S.people[a.id]||[]).length} people`:''}</span></span>
        <span class="row" style="margin-top:5px;gap:4px">${segChip2(a.seg)}${h.distinct>=2?'<span class="chip c-red">'+h.distinct+' signals</span>':''}</span>
        <p>${esc(a.why_now)}</p></span></button>`).join('')}
      ${S.rejected.length?fold('Ignored as noise ('+S.rejected.length+')','why they were dropped', `<div class="stack" style="gap:8px">${S.rejected.map(r=>`<div class="reject"><s>${esc(r.company)}</s><span class="small">${esc(r.reason)}</span></div>`).join('')}</div>`):''}
    </div>
    ${sel?accountDetail(sel):''}
  </div>`:`<div class="empty"><h3>No buyers yet</h3><p>Run a search in Find buyers.</p><button class="btn btn-primary" data-go="find">Find buyers</button></div>`);

  const acc = S.accounts.find(a=>a.id===aid); const person = (S.people[aid]||[]).find(p=>p.name===pname);
  const o = S.outreach[S.personSel];
  if (!allPeople.length) return phead(4,'Outreach','Messages are written for a named person.') + `<div class="empty"><h3>Pick a person first</h3><p>Open a buyer and find the people to contact.</p><button class="btn btn-primary" data-go="buyers">Go to Buyers</button></div>`;

function mergeLead(L, sig, sourceTitle){
  const name = String(L.company||'').trim(); if (!name) return null;
  const bad = S.business.competitors.concat([S.business.name]).some(c => name.toLowerCase().includes(c.toLowerCase().split(' ')[0]));
  if (bad){ S.rejected.unshift({company:name, sid:sig.id, reason:'Competitor or our own company.', url:L.url}); return null; }
  if (L.date && freshScore(L.date) === 0){ S.rejected.unshift({company:name, sid:sig.id, reason:'Stale: older than 12 months ('+L.date+').', url:L.url}); return null; }
  const id = slug(name);
  let a = S.accounts.find(x => x.id === id || x.company.toLowerCase() === name.toLowerCase());
  if (!a){ a = {id, seg:segById(L.seg)?L.seg:((sig.segs||[])[0]||''), company:name, domain:L.domain||'', region:L.region||'', size:'', fit:+L.fit||3, fitWhy:L.fit_why||'', why_now:L.why_now||L.what||'', risk:'', ev:[]}; S.accounts.push(a); }
  if (!a.ev.some(e => e.url === L.url && e.sid === sig.id)){
    a.ev.push({sid:sig.id, intent:+L.intent||sig.intent, date:L.date||'', dateLabel:L.date||'', title:sourceTitle||host(L.url), url:L.url, what:L.what||''});
    a.fit = Math.max(a.fit||0, +L.fit||0) || a.fit; if (!a.domain && L.domain) a.domain = L.domain;
    if (L.why_now && (+L.intent||0) >= 4) a.why_now = L.why_now;
  }
  return a;
}

async function runDemo(){
  const on = S.signals.filter(s=>s.on); if (!on.length) return;
  const onIds = new Set(on.map(s=>s.id));
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  RUN = {busy:true, stop:false, demo:true, rows:on.map(s=>({id:s.id, state:'', note:'waiting'})), log:[], found:[], rejectedNow:0, ppl:{}, pplQueue:[], scoutDone:false};
  S.accounts = []; S.people = {}; S.rejected = []; S.outreach = JSON.parse(JSON.stringify(DEMO.outreach)); S.source = 'demo';
  render(); log('Demo: replaying the verified ResearchMind run from '+DEMO.at+'.');
  async function peopleWorker(){
    while (!RUN.stop && (!RUN.scoutDone || RUN.pplQueue.length)){
      if (!RUN.pplQueue.length){ await sleep(200); continue; }
      const id = RUN.pplQueue.shift(); RUN.ppl[id] = 'searching'; renderLive();
      await sleep(900 + Math.random()*700);
      S.people[id] = JSON.parse(JSON.stringify(DEMO.people[id]||[]));
      RUN.ppl[id] = S.people[id].length ? 'done' : 'none'; renderLive();
    }
  }
  const pw = peopleWorker();
  for (const sig of on){
    if (RUN.stop) break;
    setRow(sig.id, {state:'busy', note:'searching '+(SOURCES[sig.src]||sig.src)});
    await sleep(700 + Math.random()*600);
    let n = 0;
    for (const da of DEMO.accounts.filter(a=>a.ev.some(e=>e.sid===sig.id))){
      if (S.accounts.some(x=>x.id===da.id)) continue;
      const a = JSON.parse(JSON.stringify(da)); a.ev = a.ev.filter(e=>onIds.has(e.sid));
      S.accounts.push(a); RUN.found.push(a.id); RUN.ppl[a.id] = 'queued'; RUN.pplQueue.push(a.id); n++;
    }
    for (const r of DEMO.rejected.filter(r=>r.sid===sig.id)){ S.rejected.push(JSON.parse(JSON.stringify(r))); RUN.rejectedNow++; }
    setRow(sig.id, {state:'ok', note: n ? 'done' : (DEMO.accounts.some(a=>a.ev.some(e=>e.sid===sig.id)) ? 'done' : 'no matches in the demo run'), leads:n});
  }
  RUN.scoutDone = true; await pw;
  RUN.rows.forEach(r => { if (!r.state || r.state==='busy'){ r.state='err'; r.note='stopped'; } });
  RUN.busy = false; const top = ranked()[0]; if (top) S.sel = top.a.id;
  render();
}

async function runScout(){
  if (isDemo()) return runDemo();
  if (RUN.busy) return;
  const on = S.signals.filter(s=>s.on);
  if (!on.length) return;
  RUN = {busy:true, stop:false, rows:on.map(s=>({id:s.id, state:'', note:'waiting'})), log:[], found:[], rejectedNow:0, ppl:{}, pplQueue:[], scoutDone:false};
  if (S.source==='demo'){ S.accounts=[]; S.rejected=[]; S.people={}; S.outreach={}; S.source='live'; }
  render(); log(`Hunting ${on.length} signals for ${S.business.name}…`);
  const queue = [...on];
  async function worker(){
    while (queue.length && !RUN.stop){
      const sig = queue.shift();
      setRow(sig.id, {state:'busy', note:'searching '+(SOURCES[sig.src]||sig.src)});
      try {
        let res = [];
        for (const q of geoQueries(sig)){ const seen = new Set(res.map(r=>r.url)); res = res.concat((await search(q, sig.src)).filter(r=>!seen.has(r.url))); }
        if (res.length < 3 && sig.src !== 'web') res = res.concat(await search(sig.query, 'web'));
        res = res.slice(0, 16);
        log(`${sig.id}: ${res.length} results from ${SOURCES[sig.src]||sig.src}`);
        if (RUN.stop) break;
        if (!res.length){ setRow(sig.id, {state:'ok', note:'no results found', leads:0}); continue; }
        setRow(sig.id, {note:'reading '+res.length+' results'});
        const out = await ask(P.extract(sig, res, S.business));
        const urls = new Map(res.map(r=>[r.url, r]));
        let n = 0;
        for (const L of (out.leads||[])){
          if (!urls.has(L.url)){ log(`${sig.id}: dropped "${L.company}", link not in results`); continue; }
          if (!L.date && urls.get(L.url).date) L.date = urls.get(L.url).date;
          const a = mergeLead(L, sig, urls.get(L.url).title);
          if (a){ n++; if (!RUN.found.includes(a.id)){ RUN.found.push(a.id); if (S.settings.autoPeople !== false && !(S.people[a.id]||[]).length){ RUN.ppl[a.id]='queued'; RUN.pplQueue.push(a.id); } } renderLive(); }
        }
        for (const N of (out.noise||[])){ S.rejected.push({company:N.company, sid:sig.id, reason:N.reason, url:N.url}); RUN.rejectedNow++; }
        setRow(sig.id, {state:'ok', note:n?'done':'done, nothing kept', leads:n}); log(`${sig.id}: ${n} leads kept, ${(out.noise||[]).length} rejected`);
        save();
      } catch(e){ setRow(sig.id, {state:'err', note:String(e.message||e).slice(0,90)}); log(`${sig.id}: ${e.message||e}`); }
    }
  }
  async function peopleWorker(){
    while (!RUN.stop && (!RUN.scoutDone || RUN.pplQueue.length)){
      if (!RUN.pplQueue.length){ await new Promise(r=>setTimeout(r,300)); continue; }
      // Hottest company first
      RUN.pplQueue.sort((x,y)=>heat(S.accounts.find(a=>a.id===y)||{ev:[]}).v - heat(S.accounts.find(a=>a.id===x)||{ev:[]}).v);
      const id = RUN.pplQueue.shift(), acc = S.accounts.find(a=>a.id===id); if (!acc) continue;
      RUN.ppl[id] = 'searching'; renderLive();
      try { const r = await peopleFor(acc); RUN.ppl[id] = r.kept ? 'done' : 'none'; log(`People at ${acc.company}: ${r.kept} found`); }
      catch(e){ RUN.ppl[id] = 'err'; log(`People at ${acc.company}: ${e.message||e}`); }
      save(); renderLive();
    }
  }
  const pw = [peopleWorker(), peopleWorker()];
  await Promise.all([worker(), worker(), worker()]);
  RUN.scoutDone = true;
  await Promise.all(pw);
  RUN.rows.forEach(r => { if (!r.state || r.state==='busy') { r.state='err'; r.note='stopped'; } });
  RUN.busy = false; S.runAt = new Date().toISOString().slice(0,16).replace('T',' ');
  const top = ranked()[0]; if (top) S.sel = top.a.id;
  log(`Done. ${RUN.found.length} buyers found, ${RUN.rejectedNow} rejected.`); render();
}

/* Finds named decision makers at one company. Used live during a search and from the Buyers step. */
async function peopleFor(acc, st){
  st = st || (()=>{});
  const g = segById(acc.seg);
  const roleList = g ? g.buyer.split(/,| or /).map(r=>r.trim()).filter(Boolean).slice(0,5) : ['Head of Research','Head of Design','Head of Product','Founder'];
  const roles = '(' + roleList.map(r=>'"'+r+'"').join(' OR ') + ')';
  st('Searching public profiles and the company website…');
  const [li, web] = await Promise.all([search(`"${acc.company}" ${roles}`, 'linkedin'), search(`${acc.company} leadership team ${acc.domain||''}`, 'web')]);
  const sources = li.slice(0,10).map(r=>({title:r.title, url:r.url, text:r.title+'. '+r.content}));
  const domain = acc.domain || (web.find(r=>r.url && !/linkedin|wikipedia|crunchbase|glassdoor|naukri|indeed|greenhouse|lever\.co|ashbyhq/.test(r.url))||{}).url;
  if (domain){
    const base = domain.startsWith('http') ? domain : 'https://'+domain;
    const home = await readPage(base);
    const links = (home.peopleLinks||[]).filter(l=>/team|about|leadership|people|founder/i.test(l.url+l.text)).slice(0,3);
    if (!links.length) links.push({url:base.replace(/\/$/,'')+'/about'});
    for (const l of links){ const pg = await readPage(l.url); if (pg.text) sources.push({title:pg.title||l.url, url:pg.url||l.url, text:pg.text}); }
  }
  for (const r of web.slice(0,4)) sources.push({title:r.title, url:r.url, text:r.title+'. '+r.content});
  if (!sources.length) return {kept:0, dropped:0};
  st(`Reading ${sources.length} sources…`);
  const out = await ask(P.people(acc, S.business, sources));
  const byUrl = new Map(sources.map(x=>[x.url, x]));
  const kept = (out.people||[]).filter(p => { const x = byUrl.get(p.source_url); return x && x.text.toLowerCase().includes(String(p.name).split(' ')[0].toLowerCase()); })
    .map(p => ({...p, source:host(p.source_url), linkedin: /linkedin\.com\/in\//.test(p.linkedin||p.source_url) ? (p.linkedin||p.source_url) : ''}));
  const prev = S.people[acc.id] || [];
  S.people[acc.id] = [...prev, ...kept.filter(k=>!prev.some(x=>x.name===k.name))];
  return {kept:kept.length, dropped:(out.people||[]).length-kept.length};
}
async function findPeople(){
  const acc = S.accounts.find(a=>a.id===S.sel); if (!acc || RUN.busy) return;
  RUN.busy = true; render(); const st = m => { const el=$('#peopleStatus'); if(el) el.textContent=m; };

  catch(e){ RUN.busy=false; render(); st(e.message||String(e)); }
}

/* Demo mode: a message plan built from the account's real evidence, no AI involved. */
function templateOutreach(acc, p){
  const first = String(p.name).replace(/^(Dr|Prof)\.?\s+/i,'').split(' ')[0];
  const e = [...acc.ev].sort((a,b)=>(b.intent||0)-(a.intent||0))[0] || {};
  const g = segById(acc.seg) || {};
  const uni = acc.seg==='uni' || acc.seg==='gov';
  const hook = String(e.what||acc.why_now||'').replace(/\.$/,'');
  const sender = (S.settings.sender||'ResearchMind').split(',')[0];
  const ask = uni ? 'Would free access for your next cohort be useful?' : 'Worth a 15-minute look?';
  const why = uni ? 'The step after interviews is usually the hardest for scholars: coding transcripts into themes they can defend.'
                  : 'That usually means more interviews to synthesise, and synthesis is where research teams lose the most time.';
  const offer = uni ? 'We would like to offer free access to your students for one study, and a short hands-on session.'
                    : 'We can run it on 5 of your own interviews, free, so you see the result before deciding.';
  const invite = `Hi ${first}, I saw this at ${acc.company}: ${hook.slice(0,140)}. I work on ResearchMind, which turns interview transcripts into evidence-backed insights. Happy to connect?`.slice(0,298);
  return {demo:true,
    plan:{first: uni ? 'Email' : 'LinkedIn', why: uni ? 'Academic contacts work from institutional email and answer offers that help students.' : 'Short LinkedIn notes that mention their own news get read; cold email comes second.',
      best_time:'Tue–Thu mornings', sequence:[
        {day:'Day 0', ch: uni?'Email':'LinkedIn', act: uni?'Email the offer, referencing the evidence.':'Connection note referencing the evidence.'},
        {day:'Day 3', ch: uni?'LinkedIn':'LinkedIn', act: uni?'Connect with a short note.':'If accepted, one-line DM with a 2-minute demo.'},
        {day:'Day 6', ch: uni?'Email':'Email', act:'Short follow-up with one yes/no question.'},
        {day:'Day 12', ch:'Email', act:'Last note with the free trial offer.'}]},
    messages:{
      linkedin_invite: invite,
      linkedin_followup: `Thanks for connecting, ${first}. ${why} ResearchMind clusters interviews into themes and keeps the quote behind every insight. ${ask}`,
      email_subject: uni ? `Free analysis tool access for ${acc.company} scholars` : `Interview synthesis at ${acc.company}`,
      email_body: `Hi ${first},\n\nI saw this at ${acc.company}: ${hook}.\n\n${why}\n\nResearchMind turns interview transcripts into clustered insights, with a confidence score and the exact quotes behind each one, so ${uni?'scholars can defend their analysis':'your team gets to decisions in days, not weeks'}.\n\n${offer}\n\n${ask}\n\n${sender}\nResearchMind`,
      community: uni ? 'Share a short, practical guide on coding interview transcripts in groups where their students are active. Mention the tool only when asked.'
                     : 'Comment on their next product or research post with a specific observation. No pitch.'},
    points:['Open with their news, not the product','The quote behind every insight, so AI output is trusted', uni?'Free for the cohort first':'Free run on their own interviews'],
    avoid:['Feature lists','Pricing in the first message','Generic "AI-powered" claims']};
}

async function scorePaste(){
  const t = ($('#pasteSig')||{}).value || ''; const st = $('#pasteStatus'), out = $('#pasteOut');
  if (t.trim().length < 30){ st.textContent = 'Paste a bit more: the text of the post and its link.'; return; }
  st.textContent = 'Scoring…';
  try {
    const r = await ask(P.score(t, S.business));
    const sig = sigById(r.sid);
    if (r.verdict !== 'lead'){
      S.rejected.unshift({company:r.company||'Pasted signal', sid:r.sid, reason:r.reason, url:r.url});
      out.innerHTML = `<div class="reject"><b>Noise: ${esc(r.company||'')}</b><span class="small">${esc(r.reason)}</span></div>`; st.textContent=''; save(); return;
    }
    const a = mergeLead({...r, url:r.url||'#pasted-'+Date.now()}, sig, r.url?host(r.url):'Pasted by sales');
    if (!a){ st.textContent='Rejected by the noise filter.'; render(); return; }
    if (S.source==='demo') S.source='mixed';
    S.sel = a.id; st.textContent='';
    const h = heat(a);
    out.innerHTML = `<div class="row" style="flex-wrap:nowrap;gap:12px;align-items:flex-start"><span class="heat h-${band(h.v)}">${h.v}<small>${BAND_LABEL[band(h.v)]}</small></span>
      <div><b style="color:var(--ink)">${esc(a.company)}</b> ${sigChip(r.sid)}<p class="small" style="margin:4px 0">${esc(r.why_now||r.what)}</p>
      <button class="btn-link" data-go="buyers">Open in Accounts</button></div></div>`;
    save(); renderRail();
  } catch(e){ st.textContent = e.message||String(e); }
}

async function genSignals(replace){
  const st = $('#genStatus'), focus = ($('#genFocus')||{}).value || '';
  st.className = 'status busy'; st.textContent = replace ? 'Writing a fresh set of signals…' : 'Looking for signals you are not watching yet…';
  if (isDemo()){
    await new Promise(r=>setTimeout(r,900));
    const have = new Set(S.signals.map(x=>x.name.toLowerCase()));
    const add = DEMO_SUGGEST.filter(x=>!have.has(x.name.toLowerCase()));
    S.signals.forEach(x => delete x.fresh);
    let n = S.signals.filter(x=>/^N\d+$/.test(x.id)).length;
    add.forEach(x => S.signals.push({...JSON.parse(JSON.stringify(x)), id:'N'+(++n), on:true, fresh:true}));
    render(); toast(add.length ? add.length+' new signals added' : 'All demo suggestions are already on your list'); return;
  }
  try {
    const out = await ask(P.newSignals(S.business, S.signals, focus.trim(), replace), 'complex');
    const list = (out.signals||[]).filter(x => x && x.name && x.query);
    if (!list.length) throw new Error('No signals came back. Try again, or add a focus.');
    S.signals.forEach(x => delete x.fresh);
    const mk = (x, id) => ({id, tier:['A','B','C'].includes(x.tier)?x.tier:'B', on:true, fresh:true, src:SOURCES[x.src]?x.src:'web',
      segs:(Array.isArray(x.segs)?x.segs:[]).filter(id2=>segById(id2)), name:x.name, why:x.why||'', query:x.query, lead:x.lead||'',
      earliness:Math.max(1,Math.min(5,+x.earliness||3)), intent:Math.max(1,Math.min(5,+x.intent||3)), noise:x.noise||''});
    if (replace){
      const mine = S.signals.filter(x=>x.custom);
      S.signals = list.map((x,i)=>mk(x,'S'+(i+1))).concat(mine);
    } else {
      const have = new Set(S.signals.map(x=>x.name.toLowerCase()));
      let n = S.signals.filter(x=>/^N\d+$/.test(x.id)).length;
      list.filter(x=>!have.has(String(x.name).toLowerCase())).forEach(x => S.signals.push(mk(x, 'N'+(++n))));
    }
    render(); toast(replace ? 'Fresh signals ready' : list.length+' new signals added and picked');
  } catch(e){ st.className='status'; st.textContent = e.message || String(e); }
}

async function buildProfile(){
  const v = ($('#bizIn')||{}).value||''; const st = $('#bizStatus');
  if (!v.trim()){ st.textContent='Type a website or product first.'; return; }
  st.textContent = 'Reading the business…';
  try {
    let site = '';
    const isUrl = /\.[a-z]{2,}/i.test(v) && !/\s/.test(v.trim());
    if (ENV.backend){
      st.className = 'status busy';
      if (isUrl){
        st.textContent = 'Reading the website…';
        const base = v.trim().startsWith('http') ? v.trim() : 'https://'+v.trim();
        const home = await readPage(base); site += (home.title||'') + '\n' + (home.text||'');
        const more = (home.peopleLinks||[]).filter(l=>/about|company|who-we-are|our-story/i.test(l.url)).slice(0,1);
        for (const l of more){ const pg = await readPage(l.url); site += '\n' + (pg.text||'').slice(0,3000); }
      }
      st.textContent = 'Researching who buys it…';
      const name = isUrl ? v.trim().replace(/^https?:\/\//,'').replace(/^www\./,'').split(/[\/.]/)[0] : v.trim();
      const [r1, r2] = await Promise.all([search(name+' customers case study', 'web'), search(name+' use cases who uses it', 'web')]);
      const notes = [...r1, ...r2].slice(0,10).map(r=>`- ${r.title}: ${(r.content||'').slice(0,200)} (${r.url})`).join('\n');
      if (notes) site += '\n\nWhat the web says about it:\n' + notes;
    }
    st.textContent = 'Writing the playbook…';
    const p = await ask(P.profile(v, site), 'complex');
    if (!Array.isArray(p.signals) || !p.signals.length) throw new Error('No signals came back. Try again with the website address.');
    S.business = {...RM_BUSINESS, ...p, customers:[], sender:S.settings.sender, segments:(p.segments||[]).map(g=>({...g, value:+g.value||3})), competitors:p.competitors||[], pains:p.pains||[]};
    S.signals = p.signals.map((s,i)=>({id:s.id||'S'+(i+1), tier:s.tier||'B', on:true, src:SOURCES[s.src]?s.src:'web', name:s.name, why:s.why, query:s.query, segs:Array.isArray(s.segs)?s.segs:[], lead:s.lead||'', earliness:+s.earliness||3, intent:+s.intent||3, noise:s.noise||''}));
    S.noise = p.noise && p.noise.length ? p.noise : RM_NOISE;
    S.accounts=[]; S.rejected=[]; S.people={}; S.outreach={}; S.source='live'; S.view='find';
    render(); toast('Playbook built');
  } catch(e){ st.textContent = e.message||String(e); }
}

  if (a==='settings') settingsModal();

  if (a==='reset') confirmReset();

  if (a==='scout') runScout();

  if (a==='pick'){ S.signals[i].on = t.checked; render(); }

      why:'Added by the sales team.', lead:'', earliness:tier==='A'?4:3, intent:tier==='A'?5:tier==='B'?4:3, noise:'Vendors, recruiters and anything older than 12 months.'});

  }

    S.mode = m; RUN = {busy:false, rows:[], log:[]};
    if (m === 'demo'){ loadDemoData(); toast('Back to the ResearchMind demo'); }
    else { toast(aiReady() ? 'Live mode on' : 'Live mode: connect your key below'); }
    updatePill(); render(); return;
  }
  if (a==='editKey'){ S.editKey = true; render(); setTimeout(()=>{const k=$('#keyIn'); if(k) k.focus();},0); }
  if (a==='cancelKey'){ S.editKey = false; render(); }
  if (a==='autoPpl'){ S.settings.autoPeople = t.checked; save(); }
  if (a==='geo'){ S.settings.geo = t.dataset.geo; S.settings.region = geoLabel(); render(); }
  if (a==='geoSave'){ S.settings.geoOther = $('#geoOther').value.trim(); S.settings.region = geoLabel(); render(); toast('Searching in '+geoLabel()); }
  if (a==='genMore') genSignals(false);
  if (a==='genAll') genSignals(true);
  if (a==='editSig'){ S.editSig = S.editSig===i ? null : i; render(); }
  if (a==='editSender') settingsModal();
  if (a==='saveKey'){ S.editKey = false; const k=$('#keyIn').value.trim(); if(!k){ toast('Paste a key first'); return; } S.settings.key=k; S.settings.provider=guessKind(k); updatePill(); render(); toast(ENV.backend?'Key saved':'Key saved. It is used on your deployed site.'); }
  if (a==='clearKey'){ S.settings.key=''; S.settings.provider='auto'; updatePill(); render(); toast('Key removed'); }
  if (a==='findPeople') findPeople();
  if (a==='write') writeOutreach();
  if (a==='scorePaste') scorePaste();
  if (a==='buildProfile') buildProfile();
  if (a==='toPeople'){ S.sel = t.dataset.id; S.view='buyers'; render(); window.scrollTo(0,0); }
  if (a==='toOutreach'){ S.personSel = t.dataset.key; S.view='outreach'; S.msgTab='linkedin_invite'; render(); window.scrollTo(0,0); }
  if (a==='dropAcc'){ const ac=S.accounts.find(x=>x.id===t.dataset.id); if(ac){ S.rejected.unshift({company:ac.company, reason:'Marked as noise by sales.', url:(ac.ev[0]||{}).url}); S.accounts=S.accounts.filter(x=>x!==ac); S.sel=(ranked()[0]||{a:{}}).a.id; render(); } }
  if (a==='copyMsg') copy(($('#msgBody')||{}).textContent||'');
  if (a==='copyMd') copy(toMarkdown());
  if (a==='copyJson') copy(JSON.stringify({recipe:'who-buys-next/v1', business:S.business, signals:S.signals, weights:S.weights, stack:S.stack, noise:S.noise}, null, 2));
  if (a==='csv') copy(toCSV());
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.w){ if (t.dataset.w==='stack') S.stack = +t.value; else S.weights[t.dataset.w] = +t.value;
    const lab = t.nextElementSibling; if (lab) lab.textContent = t.dataset.w==='stack' ? '+'+S.stack : t.value;
    const w=S.weights, f=document.querySelector('.formula'); if (f) f.innerHTML = `Heat = ( ${w.intent}·Intent + ${w.early}·Earliness + ${w.fit}·Fit + ${w.fresh}·Freshness ) ÷ ${w.intent+w.early+w.fit+w.fresh} ÷ 5 × 100<br>+${S.stack} for each extra signal at the same company (max 2) · capped at 100<br>HOT ≥ 75 · WARM 55–74 · WATCH &lt; 55`;
    save(); }
  if (t.dataset.set){ S.settings[t.dataset.set] = t.value; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.w) renderRail();
  if (t.id==='accPick'){ S.sel = t.value; render(); }
  if (t.id==='personPick'){ S.personSel = t.value; render(); }
  if (t.id==='sSearch2'){ S.settings.searchMode = t.value; save(); }
});
document.addEventListener('focusout', e => {
  const t = e.target; if (t.dataset && t.dataset.q!=null){ S.signals[+t.dataset.q].query = t.textContent.trim(); save(); }
});

function updatePill(){
  const el = $('#modePill');
  if (isDemo()){ el.className='pill p-ai'; el.innerHTML='<span class="dot"></span>Demo · ResearchMind'; }
  else { el.className='pill p-live'; el.innerHTML='<span class="dot"></span>Live'+(aiReady()?(aiSearchReady()?' · search + AI':' · AI ready'):' · add your API key'); }
}

(async function boot(){
  render();
  try {
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 3500);
    const r = await fetch('api/ok', {signal:ctl.signal}); clearTimeout(tm);
    if (r.ok){ const j = await r.json(); if (j.ok){ ENV.backend = true; ENV.serverAI = Object.values(j.providers||{}).some(Boolean); ENV.serverSearch = !!(j.providers && (j.providers.claude || j.providers.gemini)); } }
  } catch(e){}
  updatePill(); render();
})();
</script>
